// The shared layer registry (midrash-viewer-core): one selection model, and one
// place that knows which apparatus is switched on and where it renders. Built
// once, outlives every tractate load -- see viewer_layers.js for the layers.
let viewer = null;

// The parallels-mode radio is a view of two facts that are already stored
// elsewhere -- whether the inline layer is on (the registry, restored from
// localStorage across sessions) and which mode was last chosen
// (parallelsBesideState) -- so it is set FROM them and never treated as the
// store. Called after every tractate load, because the registry re-runs
// availability there and a tractate with no parallels turns the layer off
// underneath a control that would otherwise go on claiming they were showing.
function syncParallelsModeRadio() {
    const on = viewer && viewer.isEnabled('parallel-extents');
    const value = !on ? 'off' : (parallelsBesideState ? 'beside' : 'band');
    const radio = document.getElementById(`parallels-mode-${value}`);
    if (radio) radio.checked = true;
    // Sub-unit splitting is a refinement of band mode alone -- see the note on
    // the checkbox. Disabled rather than hidden, so the option doesn't appear and
    // vanish as the mode changes.
    document.getElementById('parallel-subunits').disabled = value !== 'band';
}

function displayTextAndVariants(textData, variantsData, witnessData, manuscriptDataBySlug, editionsData, commentaryBySlug, ocrCommentaryBySlug, parallelsData, apparatusData){
    const masechetName = (variantsData.title || '').replace('Variants on ', '');

    // Mounted panels outlive a tractate switch and take the new data through
    // setContext, rather than being torn down and rebuilt: that's what stops
    // each load from leaving another set of window-level pan/fullscreen
    // listeners behind, which both this and the hand-rolled version before it
    // used to do.
    if (!viewer) viewer = createToseftaViewer();
    viewer.setContext({
        masechet: masechetName,
        textData, variantsData, witnessData, manuscriptDataBySlug, editionsData,
        commentaryBySlug, ocrCommentaryBySlug, parallelsData, apparatusData,
        // A display option, not data -- but the inline layer reads its whole
        // world from ctx, so it travels the same way rather than the layer
        // reaching into the DOM for a checkbox.
        parallelSubunits: document.getElementById('parallel-subunits').checked,
        parallelsBeside: parallelsBesideState,
    });

    // The parallels settings tab: rebuilt once per tractate load (not per
    // re-render -- the rows carry this tractate's own counts, and rebuilding
    // them under the reader would also collapse whatever they had opened).
    // Hidden altogether where there is nothing to filter, with the reader
    // pushed back to the first tab so they aren't left staring at a blank pane.
    const hasParallels = !!(parallelsData && parallelsData.chapters
                            && Object.keys(parallelsData.chapters).length);
    document.getElementById('sidebar-tab-parallels').hidden = !hasParallels;
    if (hasParallels) {
        renderParallelsFilterUI(document.getElementById('parallels-filters'),
                                parallelsData, onParallelsFilterChange,
                                { hasApparatus: parallelsApparatusAvailable(apparatusData) });
    } else {
        document.getElementById('parallels-filters').innerHTML = '';
        showSidebarPane('sidebar-pane-text');
    }
    syncParallelsModeRadio();

    const contentContainer = document.getElementById('content-container');
    const showHiddenCheckbox = document.getElementById('showHidden');
    const hideMinorOrthographyCheckbox = document.getElementById('hideMinorOrthography');
    const hideNameOrthographyCheckbox = document.getElementById('hideNameOrthography');
    const hideMinorCheckbox = document.getElementById('hideMinor');
    const hideOtherMinorCheckbox = document.getElementById('hideOtherMinor');
    const hideCitationScopeCheckbox = document.getElementById('hideCitationScope');
    const hideRoutineCheckbox = document.getElementById('hideRoutine');
    const hideMorphologyCheckbox = document.getElementById('hideMorphology');

    // --- Highlight linking between sup refs and note spans ---
    let activeNoteId = null;

    function clearHighlights() {
        if (!activeNoteId) return;
        contentContainer.querySelectorAll(`.highlight[data-note-id="${activeNoteId}"]`).forEach(el => {
            el.classList.remove('highlight');
        });
        activeNoteId = null;
    }

    function highlightNote(noteId) {
        clearHighlights();
        activeNoteId = noteId;
        contentContainer.querySelectorAll(`[data-note-id="${noteId}"]`).forEach(el => {
            el.classList.add('highlight');
        });
    }

    // --- Persistent synopsis footer: click a word, footnote marker, or
    // apparatus reading anywhere and the footer scrolls to and highlights
    // the matching row. Scoped per-halakha by default (Erfurt can split or
    // even reorder halakhot relative to Vienna, so a chapter-wide fixed grid
    // isn't reliable) with prev/next nav and an explicit whole-chapter toggle.
    const synopsisFooter = document.getElementById('synopsis-footer');
    const synopsisFooterBody = document.getElementById('synopsis-footer-body');
    const synopsisFooterLabel = document.getElementById('synopsis-footer-label');
    const synopsisShowChapterCheckbox = document.getElementById('synopsisShowChapter');
    let footerState = { perekIndex: 0, halachaIndex: 0 };

    function halakhaCountFor(perekIndex) {
        return (textData.text[perekIndex] || []).length;
    }

    function clampFooterState() {
        const nChapters = textData.text.length;
        footerState.perekIndex = Math.max(0, Math.min(footerState.perekIndex, nChapters - 1));
        const nHal = halakhaCountFor(footerState.perekIndex);
        footerState.halachaIndex = Math.max(0, Math.min(footerState.halachaIndex, nHal - 1));
    }

    function renderSynopsisFooter(highlightBaseIdx) {
        if (!witnessData) { console.log('[synopsis] renderSynopsisFooter: no witnessData at all'); return; }
        clampFooterState();
        const { perekIndex, halachaIndex } = footerState;
        const chapterWitness = witnessData.chapters[perekIndex];
        const textPerek = textData.text[perekIndex];
        const showChapter = synopsisShowChapterCheckbox.checked;
        console.log('[synopsis] renderSynopsisFooter', { perekIndex, halachaIndex, highlightBaseIdx, showChapter, hasChapterWitness: !!chapterWitness });
        synopsisFooterBody.innerHTML = '';

        if (!chapterWitness) {
            console.log('[synopsis] no chapterWitness for perekIndex', perekIndex, 'chapters length', witnessData.chapters.length);
            synopsisFooterBody.textContent = 'אין נתוני עדי נוסח לפרק זה.';
        } else {
            const { ranges } = computeChapterWordIndex(textPerek);
            console.log('[synopsis] ranges for chapter', perekIndex, ranges);
            if (showChapter) {
                textPerek.forEach((halakhaHtml, hi) => {
                    const label = document.createElement('div');
                    label.className = 'synopsis-footer-halakha-label';
                    label.textContent = `הלכה ${hi + 1}`;
                    synopsisFooterBody.appendChild(label);
                    const movementTable = buildMovementTableForHalakha(chapterWitness, ranges, textPerek, hi, { chapterView: true });
                    if (movementTable) synopsisFooterBody.appendChild(movementTable);
                    const table = buildSynopsisStrips(chapterWitness, ranges[hi], halakhaHtml, ranges);
                    if (!table) console.log('[synopsis] show-chapter: no table for halakha', hi, 'range', ranges[hi]);
                    if (table) synopsisFooterBody.appendChild(table);
                });
            } else {
                const movementTable = buildMovementTableForHalakha(chapterWitness, ranges, textPerek, halachaIndex, { chapterView: false });
                if (movementTable) synopsisFooterBody.appendChild(movementTable);
                const table = buildSynopsisStrips(chapterWitness, ranges[halachaIndex], textPerek[halachaIndex], ranges);
                if (table) {
                    synopsisFooterBody.appendChild(table);
                } else {
                    console.log('[synopsis] single-halakha: no table for halachaIndex', halachaIndex, 'range', ranges[halachaIndex]);
                    synopsisFooterBody.textContent = 'אין נתוני עדי נוסח להלכה זו.';
                }
            }
        }

        synopsisFooterLabel.textContent = `פרק ${convert_number(perekIndex + 1)}, הלכה ${halachaIndex + 1}`;

        if (highlightBaseIdx != null) {
            // Highlight the same word position ("column") across every
            // horizontal witness strip, not just one row.
            const words = [...synopsisFooterBody.querySelectorAll(`[data-base-idx="${highlightBaseIdx}"]`)];
            console.log('[synopsis] highlight lookup for baseIdx', highlightBaseIdx, '-> matched cells:', words.length);
            words.forEach(w => w.classList.add('synw-active'));
            if (words[0]) words[0].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }
    }

    function syncFooterTo(perekIndex, halachaIndex, baseIdx) {
        if (!isNavToggleOn('synopsisMode')) return;
        footerState = { perekIndex, halachaIndex };
        renderSynopsisFooter(baseIdx);
    }

    function resolveNoteIdToBaseIdx(noteId) {
        // Sotah's merged "notes" mode (buildKiyMergedNotes) uses a different id
        // shape, n-<perek>-<halakha>-k<wi>, where wi is already a halakha-local
        // base-word position (a Vienna-word index) -- not an apparatus-note
        // occurrence index like the plain n-<p>-<h>-<idx> form below, so it
        // resolves directly via ranges instead of markerBaseIdx.
        const km = /^n-(\d+)-(\d+)-k(\d+)$/.exec(noteId);
        if (km) {
            const perekIndex = Number(km[1]), halachaIndex = Number(km[2]), wi = Number(km[3]);
            const { ranges } = computeChapterWordIndex(textData.text[perekIndex]);
            const range = ranges[halachaIndex];
            if (!range) { console.log('[synopsis] resolveNoteIdToBaseIdx: k-pattern, no range', { noteId }); return null; }
            const result = { perekIndex, halachaIndex, baseIdx: range[0] + wi };
            console.log('[synopsis] resolveNoteIdToBaseIdx resolved (k-pattern)', { noteId, ...result });
            return result;
        }
        const m = /^n-(\d+)-(\d+)-(\d+)$/.exec(noteId);
        if (!m) { console.log('[synopsis] resolveNoteIdToBaseIdx: noteId did not match pattern', noteId); return null; }
        const perekIndex = Number(m[1]), halachaIndex = Number(m[2]), noteIdx = Number(m[3]);
        const variantsChapter = variantsData.text[perekIndex] || [];
        const supIdx = noteIdx - (isKiyChapter(variantsChapter) ? 1 : 0);
        if (supIdx < 0) { console.log('[synopsis] resolveNoteIdToBaseIdx: supIdx < 0 (leading כי"ע note)', { noteId, supIdx }); return { perekIndex, halachaIndex, baseIdx: null }; }
        const { markerBaseIdx } = computeChapterWordIndex(textData.text[perekIndex]);
        const markers = markerBaseIdx[halachaIndex] || [];
        if (supIdx >= markers.length) { console.log('[synopsis] resolveNoteIdToBaseIdx: supIdx out of range', { noteId, supIdx, markersLength: markers.length }); return { perekIndex, halachaIndex, baseIdx: null }; }
        const result = { perekIndex, halachaIndex, baseIdx: markers[supIdx] + 1 };
        console.log('[synopsis] resolveNoteIdToBaseIdx resolved', { noteId, ...result });
        return result;
    }

    // The manuscript-image panel is now a registered dock layer -- see
    // MANUSCRIPT_LAYER in viewer_layers.js, which also owns
    // SIGLUM_TO_WITNESS_SLUG, WITNESS_HEB_LABEL, witnessSlugForSynopsisSiglum
    // and resolveManuscriptEntry. Clicks reach it by setting the shared
    // selection, not by a dedicated sync function.
    const selection = viewer.selection;

    // Build the address a click refers to. `baseIdx` is nullable throughout the
    // shared address model: an apparatus entry that can only be placed to its
    // halakhah is a first-class case, not a degraded word anchor.
    function addressAt(perekIndex, halachaIndex, baseIdx) {
        return MidrashViewerCore.address.makeAddress(masechetName, perekIndex, halachaIndex, baseIdx);
    }


    // Reverse sync: clicking a word inside the synopsis table scrolls to and
    // briefly highlights the matching word back in the main text.
    synopsisFooterBody.addEventListener('click', (e) => {
        const cell = e.target.closest('.synw[data-base-idx]');
        if (!cell) return;
        const baseIdx = cell.dataset.baseIdx;
        const perekIndex = footerState.perekIndex;
        const target = contentContainer.querySelector(`[id^="hal-${perekIndex}-"] .body-word[data-base-idx="${baseIdx}"]`);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('highlight');
            setTimeout(() => target.classList.remove('highlight'), 2000);
        }
        synopsisFooterBody.querySelectorAll('.synw-active').forEach(el => el.classList.remove('synw-active'));
        synopsisFooterBody.querySelectorAll(`[data-base-idx="${baseIdx}"]`).forEach(el => el.classList.add('synw-active'));

        // Drive the manuscript viewer with whichever witness this row is --
        // 'בסיס' (the base row) resolves to Vienna, 'א' to Erfurt; rows for
        // sigla with no manuscript-image data (ד/ל/ג/ש) don't drive it.
        const row = cell.closest('tr');
        const witnessSlug = row && witnessSlugForSynopsisSiglum(row.dataset.siglum);
        selection.set(addressAt(perekIndex, footerState.halachaIndex, Number(baseIdx)),
                      { source: 'synopsis', witnessId: witnessSlug });
    });

    document.getElementById('synopsis-prev').addEventListener('click', () => {
        footerState.halachaIndex -= 1;
        if (footerState.halachaIndex < 0) {
            footerState.perekIndex -= 1;
            clampFooterState();
            footerState.halachaIndex = halakhaCountFor(footerState.perekIndex) - 1;
        }
        renderSynopsisFooter();
    });
    document.getElementById('synopsis-next').addEventListener('click', () => {
        footerState.halachaIndex += 1;
        if (footerState.halachaIndex >= halakhaCountFor(footerState.perekIndex)) {
            footerState.perekIndex += 1;
            clampFooterState();
            footerState.halachaIndex = 0;
        }
        renderSynopsisFooter();
    });
    synopsisShowChapterCheckbox.addEventListener('change', () => renderSynopsisFooter());
    document.getElementById('synopsis-footer-close').addEventListener('click', () => {
        setNavToggleOn('synopsisMode', false);
        if (typeof refreshCurrentDisplay === 'function') refreshCurrentDisplay();
    });

    // The manuscript viewer shows whichever witness a click is specifically
    // about (Erfurt for an 'א' reading, Vienna for witness-neutral base text
    // or an explicit 'ב' reading); a click landing on some OTHER witness's
    // reading (ד/ל/ג/ש, no image data) doesn't drive it, even though the
    // shared baseIdx would technically still resolve.
    function resolveNoteManuscriptWitness(noteId, e) {
        // Sotah's merged "notes" mode (k-pattern) exists specifically to show
        // Erfurt's parallel text -- every note there is inherently Erfurt's.
        if (/^n-\d+-\d+-k\d+$/.test(noteId)) return 'Erfurt';
        // If the click landed on one specific witness's reading within a
        // (possibly multi-witness) note, judge by THAT reading alone.
        const reading = e.target.closest('.variant-reading');
        if (reading && reading.dataset.witnesses !== undefined) {
            for (const siglum of Object.keys(SIGLUM_TO_WITNESS_SLUG)) {
                if (reading.dataset.witnesses.includes(siglum)) return SIGLUM_TO_WITNESS_SLUG[siglum];
            }
            return null;
        }
        // Otherwise (clicked the note-ref marker, or the lemma part rather
        // than a specific reading) fall back to: does this note have a
        // reading from a witness we have images for? Priority order follows
        // SIGLUM_TO_WITNESS_SLUG's insertion order (א > ב > ג): Erfurt is the
        // most specific witness, Vienna is the base, Geniza is sparse/
        // fragmentary so lowest priority among the three.
        const span = contentContainer.querySelector(`.note-span[data-note-id="${noteId}"]`);
        if (!span) return null;
        const readings = [...span.querySelectorAll('.variant-reading[data-witnesses]')];
        for (const siglum of Object.keys(SIGLUM_TO_WITNESS_SLUG)) {
            if (readings.some(r => r.dataset.witnesses.includes(siglum))) return SIGLUM_TO_WITNESS_SLUG[siglum];
        }
        return null;
    }

    // Click a body word, a witness-strip word, a footnote marker, or an
    // apparatus reading -- sync the footer to that position.
    contentContainer.addEventListener('click', (e) => {
        const wordEl = e.target.closest('.body-word, .witness-word');
        if (wordEl && wordEl.dataset.baseIdx !== undefined) {
            const pair = wordEl.closest('.paragraph-pair');
            const m = pair && /^hal-(\d+)-(\d+)$/.exec(pair.id);
            console.log('[synopsis] content click matched word/witness element', { text: wordEl.textContent, baseIdx: wordEl.dataset.baseIdx, pairId: pair && pair.id, matchedPairPattern: !!m });
            if (m) {
                syncFooterTo(Number(m[1]), Number(m[2]), Number(wordEl.dataset.baseIdx));
                // .body-word has no siglum (witness-neutral base text, i.e.
                // Vienna). .witness-word belongs to a specific witness strip;
                // only sync the image if that witness has manuscript data.
                const strip = wordEl.closest('.witness-strip');
                const witnessSlug = strip ? SIGLUM_TO_WITNESS_SLUG[strip.dataset.siglum] : 'Vienna';
                selection.set(addressAt(Number(m[1]), Number(m[2]), Number(wordEl.dataset.baseIdx)),
                              { source: 'body', witnessId: witnessSlug });
            }
            return;
        }
        const noteEl = e.target.closest('.note-ref, .note-span');
        if (noteEl && noteEl.dataset.noteId) {
            const resolved = resolveNoteIdToBaseIdx(noteEl.dataset.noteId);
            console.log('[synopsis] content click matched note element', { noteId: noteEl.dataset.noteId, resolved });
            if (resolved && resolved.baseIdx != null) {
                syncFooterTo(resolved.perekIndex, resolved.halachaIndex, resolved.baseIdx);
                selection.set(addressAt(resolved.perekIndex, resolved.halachaIndex, resolved.baseIdx),
                              { source: 'apparatus', witnessId: resolveNoteManuscriptWitness(noteEl.dataset.noteId, e) });
            }
        } else {
            console.log('[synopsis] content click matched neither word/witness nor note', { tag: e.target.tagName, classes: e.target.className });
        }
    });

    // Event delegation on the content container
    contentContainer.addEventListener('mouseover', (e) => {
        const ref = e.target.closest('.note-ref, .note-span');
        if (ref && ref.dataset.noteId) {
            highlightNote(ref.dataset.noteId);
        }
    });
    contentContainer.addEventListener('mouseout', (e) => {
        const ref = e.target.closest('.note-ref, .note-span');
        if (ref) {
            clearHighlights();
        }
    });
    // Click on a sup scrolls the note into view
    contentContainer.addEventListener('click', (e) => {
        const ref = e.target.closest('.note-ref');
        if (ref && ref.dataset.noteId) {
            const noteId = ref.dataset.noteId;
            // Find the first matching note-span (prefer visible column)
            const target = contentContainer.querySelector(`.variant-content .note-span[data-note-id="${noteId}"]`)
                        || contentContainer.querySelector(`.note-span[data-note-id="${noteId}"]`);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                highlightNote(noteId);
            }
        }
    });

    // Base-text sourcing differs by tractate (Sefaria-hosted Lieberman
    // edition, our own in-house diplomatic transcriptions, the vocalized
    // edBeeri/Zuckermandel set, or a Sefaria Vilna-print fallback where
    // nothing else exists yet) -- surface which one is showing so it's
    // never mistaken for another edition's readings.
    function getEditionLabel(textData) {
        const title = textData.title || '';
        const versionTitle = textData.versionTitle || '';
        if (title.includes('(Lieberman)')) {
            return 'מהדורת ליברמן (כתב יד וינה ועוד)';
        }
        if (versionTitle.includes('edBeeri')) {
            return 'מהדורת בארי (על פי צוקרמנדל, מנוקד)';
        }
        if (versionTitle.includes('In-house diplomatic')) {
            const m = versionTitle.match(/based on MS (\w+)/);
            const msNamesHe = { Erfurt: 'ערפורט', Vienna: 'וינה' };
            const msHe = m ? (msNamesHe[m[1]] || m[1]) : '';
            return `עריכה פנימית (כתב יד ${msHe})`.trim();
        }
        if (versionTitle.includes('Machon Mamre') || versionTitle.includes('Vilna')) {
            return 'דפוס וילנא (מכון ממרא, דרך ספריא -- ללא חילופי נוסח)';
        }
        return versionTitle || 'מהדורה לא ידועה';
    }

    function updateDisplay() {
        let hidden_count = 0;
        let total_count = 0;
        const fullyHiddenNotes = new Set();
        contentContainer.innerHTML = ''; // Clear existing content
        const hiddenCategories = getHiddenCategoriesSet();
        const hiddenReasonDetails = getHiddenReasonDetailsSet();
        const hideSoleWitnessSigla = getHideSoleWitnessSigla();

        // Toggle the 'show-hidden' class on the container
        contentContainer.classList.toggle('show-hidden', showHiddenCheckbox.checked);

        const editionNoteEl = document.getElementById('edition-note');
        editionNoteEl.textContent = `מהדורה: ${getEditionLabel(textData)}`;
        editionNoteEl.hidden = false;

        const textArray = textData.text;
        const variantsArray = variantsData.text;
        const masechet = variantsData.title.split("Variants on ")[1];

        // Detect כי"ע chapters and reveal the Sotah panel only when relevant.
        const anyKiyChapter = variantsArray.some(ch => isKiyChapter(ch));
        const sotahPanel = document.getElementById('sotah-panel');
        sotahPanel.hidden = !anyKiyChapter;
        const sotahModeInput = document.querySelector('input[name="sotahMode"]:checked');
        const sotahMode = sotahModeInput ? sotahModeInput.value : 'default';

        // Witness-transcription panel: only relevant when this tractate has
        // any witness-alignment data at all.
        const hasWitnessData = !!(witnessData && Array.isArray(witnessData.chapters) && witnessData.chapters.length);
        const witnessPanel = document.getElementById('witness-panel');
        witnessPanel.hidden = !hasWitnessData;
        document.getElementById('synopsisMode').hidden = !hasWitnessData;
        const activeWitnessSigla = hasWitnessData
            ? [...document.querySelectorAll('.witness-strip-toggle:checked')].map(cb => cb.dataset.siglum)
            : [];
        const synopsisModeOn = hasWitnessData && isNavToggleOn('synopsisMode');
        document.getElementById('synopsis-footer').hidden = !synopsisModeOn;
        document.body.classList.toggle('synopsis-footer-open', synopsisModeOn);
        if (synopsisModeOn) renderSynopsisFooter();
        // Both of the synopsis button's states were just decided here, and the
        // registry -- which drives this everywhere else -- cannot see this button.
        syncApparatusMenu();

        // The manuscript-image panel needs nothing here any more: the registry
        // decides whether it's relevant (MANUSCRIPT_LAYER.available -- any
        // baseIdx-joined manuscript data for this tractate), whether it's
        // showing, and what its nav button reads. See viewer_layers.js.

        // Alternate-edition numbering overlay (Vilna / Lieberman-Zuckermandel):
        // a scheme's checkbox is only shown when this tractate actually has
        // that scheme's alignment data AND it's not "native" (structurally
        // identical to our own chapter/halakhah grid, in which case the
        // overlay would draw no line anywhere ours doesn't already). Hidden
        // schemes reset to unchecked so state doesn't carry over silently
        // across tractate switches.
        const activeOverlaySchemes = [];
        let anySchemeAvailable = false;
        ['vilna', 'lz'].forEach(key => {
            const wrap = document.getElementById(`numbering-overlay-${key}-wrap`);
            const checkbox = document.getElementById(`numbering-overlay-${key}`);
            const schemeData = editionsData && editionsData[key];
            // Both overlays are also pointless (not just when structurally
            // native) whenever the tractate's own base text already comes
            // from that same tradition -- showing "X vs. itself" would just
            // surface our text's own minor normalization noise, not a real
            // alternate numbering: lz when our base is Lieberman's Codex
            // Vienna JTS edition, vilna when our base is itself sourced from
            // Machon Mamre (mechon-mamre.org -- confirmed via Sefaria's own
            // version metadata to BE the Vilna print tradition, see
            // [[edition_numbering_overlay]]).
            const ourBaseIsMachonMamre = /mechon-mamre/i.test(textData.versionTitle || '');
            const pointless = !schemeData || schemeData.native
                || (key === 'lz' && schemeData.edition === 'lieberman')
                || (key === 'vilna' && ourBaseIsMachonMamre);
            const available = !pointless;
            wrap.hidden = !available;
            if (!available) {
                editionOverlayState[key] = false;
                checkbox.checked = false;
            } else {
                anySchemeAvailable = true;
                checkbox.checked = editionOverlayState[key];
                if (editionOverlayState[key]) {
                    activeOverlaySchemes.push({ key, name: EDITION_SCHEME_NAMES[key], breakpoints: schemeData.breakpoints });
                }
            }
        });
        document.getElementById('numbering-panel').hidden = !anySchemeAvailable;

        textArray.forEach((textPerek, perekIndex) => {
            const chapterWitness = hasWitnessData ? witnessData.chapters[perekIndex] : null;
            const needsWordIndex = chapterWitness || activeOverlaySchemes.length;
            const { ranges: halakhaWordRanges } = needsWordIndex ? computeChapterWordIndex(textPerek) : { ranges: null };
            // Add chapter header
            const chapterHeader = document.createElement('h2');
            chapterHeader.className = 'chapter-header';
            chapterHeader.id = `perek-${perekIndex}`;
            chapterHeader.textContent = `פרק ${ convert_number(perekIndex + 1)}`;
            activeOverlaySchemes.forEach(scheme => {
                const altLabel = editionChapterHeaderLabel(scheme.breakpoints, scheme.name, perekIndex);
                if (altLabel) {
                    const altSpan = document.createElement('span');
                    altSpan.className = 'chapter-header-alt';
                    altSpan.textContent = altLabel;
                    chapterHeader.appendChild(altSpan);
                }
            });
            contentContainer.appendChild(chapterHeader);

            const chapterIsKiy = isKiyChapter(variantsArray[perekIndex]);

            textPerek.forEach((textItem, halachaIndex) => {
                const paragraphPair = document.createElement('div');
                paragraphPair.className = 'paragraph-pair';
                if (chapterIsKiy && (sotahMode === 'two-col' || sotahMode === 'marked')) {
                    paragraphPair.classList.add('two-col-kiy');
                }
                paragraphPair.id = `hal-${perekIndex}-${halachaIndex}`;

                // Add paragraph (halacha) number
                const paragraphNumber = document.createElement('span');
                paragraphNumber.className = 'paragraph-number';
                paragraphNumber.textContent = halachaIndex + 1;
                paragraphPair.appendChild(paragraphNumber);

                // Sotah notes mode: dedicated merged-apparatus renderer that
                // anchors both the existing variant notes and the Erfurt diffs
                // to Vienna word positions and merges co-located notes
                // (ports sotah_footnoted.py).
                if (chapterIsKiy && sotahMode === 'notes') {
                    const halVars = variantsArray[perekIndex][halachaIndex] || [];
                    const { viennaWords, mergedAt } = buildKiyMergedNotes(textItem, halVars);
                    const sortedPos = [...mergedAt.keys()].sort((a, b) => a - b);
                    const posLabel = new Map();
                    sortedPos.forEach((pos, i) => posLabel.set(pos, i + 1));

                    const textParagraph = document.createElement('p');
                    textParagraph.className = 'text-content';
                    let bodyHtml = '';
                    viennaWords.forEach((word, wi) => {
                        if (wi > 0) bodyHtml += ' ';
                        if (mergedAt.has(wi)) {
                            const noteId = `n-${perekIndex}-${halachaIndex}-k${wi}`;
                            bodyHtml += `<sup class="note-ref" data-note-id="${noteId}">${posLabel.get(wi)}</sup>`;
                        }
                        bodyHtml += word;
                    });
                    textParagraph.innerHTML = bodyHtml;

                    const variantParagraph = document.createElement('div');
                    variantParagraph.className = 'variant-content';
                    sortedPos.forEach(pos => {
                        const noteId = `n-${perekIndex}-${halachaIndex}-k${pos}`;
                        const label = posLabel.get(pos);
                        mergedAt.get(pos).forEach(entry => {
                            let inner;
                            if (entry.raw !== undefined) {
                                inner = `<sup>${label}</sup> ${entry.raw}`;
                            } else {
                                const svLabel = entry.suffix ? `${entry.sv} ${entry.suffix}` : entry.sv;
                                const bodyStr = entry.merged
                                    .map(([src, reading]) => `<span class="variant">${src}</span>&nbsp;${reading}`)
                                    .join('. ');
                                inner = `<sup>${label}</sup> <b>${svLabel}</b> | ${bodyStr}.`;
                            }
                            variantParagraph.innerHTML += `<span class="note-span" data-note-id="${noteId}">${inner}</span> `;
                        });
                    });

                    paragraphPair.appendChild(textParagraph);
                    paragraphPair.appendChild(variantParagraph);
                    contentContainer.appendChild(paragraphPair);
                    return;
                }

                // Pre-scan apparatus per halakha: identify
                //   - note indices with פתוח readings (for line-break injection)
                //   - eclectic swap candidates (note index → swap info)
                const showPatuachLineBreaks = document.getElementById('paragraphBreakLineBreaks').checked;
                const eclecticEnabled = document.getElementById('eclecticText').checked;
                const patuachNoteIdxs = new Set();
                const swapMap = new Map();  // idx → { lemma, altText, altWitnesses, origLemmaRaw }
                if (variantsArray[perekIndex] && Array.isArray(variantsArray[perekIndex][halachaIndex])) {
                    variantsArray[perekIndex][halachaIndex].forEach((variantItem, idx) => {
                        if (typeof variantItem !== "string" || !variantItem.includes("|")) return;
                        const parsed = parseNote3(variantItem, [masechet, perekIndex, halachaIndex]);
                        if (!Array.isArray(parsed)) return;
                        const sv = parsed[0];
                        const vars = parsed[1];
                        const affirming = parsed.length === 3 ? parsed[2] : null;
                        if (!Array.isArray(vars)) return;

                        if (showPatuachLineBreaks) {
                            const hasPatuach = vars.some(([, t]) => /^\s*פתוח\s*$/.test(String(t || "").replace(/<[^>]+>/g, "")));
                            if (hasPatuach) patuachNoteIdxs.add(idx);
                        }

                        if (eclecticEnabled) {
                            const swap = findEclecticSwap(sv, vars, affirming);
                            if (swap) swapMap.set(idx, swap);
                        }
                    });
                }

                // Display main text — inject data-note-id on each sup, and
                // for פתוח-tagged markers, inject a <br> AFTER the lemma word
                // (the next non-whitespace token following the marker) so the
                // line break visually corresponds to where the paragraph ends.
                const textParagraph = document.createElement('p');
                textParagraph.className = 'text-content';
                let supIndex = 0;
                const updatedText = textItem.replace(
                    /<i data-commentator="Variants" data-label="([^"]+)" data-order="\d+"><\/i>(\S+)?/g,
                    (match, label, lemmaToken) => {
                        // In כי"ע chapters the apparatus has an extra leading note
                        // (the כי"ע Erfurt block) with no body marker, so body
                        // marker i corresponds to apparatus note i+1. Offset the
                        // index so noteId / swap / patuach lookups stay aligned.
                        const idx = (supIndex++) + (chapterIsKiy ? 1 : 0);
                        const noteId = `n-${perekIndex}-${halachaIndex}-${idx}`;
                        const isPatuach = patuachNoteIdxs.has(idx);
                        const swap = swapMap.get(idx);
                        const sup = `<sup class="note-ref" data-note-id="${noteId}">${label}</sup>`;
                        const suffix = isPatuach ? '<br>' : '';
                        // Eclectic swap: the lemma in the body matches swap.lemma.
                        // - Normal swap: replace with alt text in green.
                        // - Omission swap (alt = ח'/חסר): drop the lemma word from
                        //   the body entirely. The sup marker remains, floating
                        //   without an attached word, and the apparatus note carries
                        //   the explanation.
                        if (swap && lemmaToken) {
                            const tokenWord = lemmaToken.replace(/[,.;:!?׳״]+$/, '');
                            const tokenPunct = lemmaToken.slice(tokenWord.length);
                            if (tokenWord === swap.lemma) {
                                swap.applied = true;
                                if (swap.isOmission) {
                                    return `${sup}${tokenPunct}${suffix}`;
                                }
                                return `${sup}<span class="eclectic-swap" data-note-id="${noteId}">${swap.altText}</span>${tokenPunct}${suffix}`;
                            }
                        }
                        return sup + (lemmaToken || '') + suffix;
                    }
                );
                textParagraph.innerHTML = updatedText;
                const range = halakhaWordRanges ? halakhaWordRanges[halachaIndex] : null;
                if (range) {
                    annotateWordsWithBaseIdx(textParagraph, range[0]);
                }
                if (activeOverlaySchemes.length && range) {
                    activeOverlaySchemes.forEach(scheme => {
                        const hereBreakpoints = editionBreakpointsInHalakha(scheme.breakpoints, perekIndex, halachaIndex);
                        if (hereBreakpoints.length) {
                            insertEditionMarkers(textParagraph, hereBreakpoints, scheme.name, range[0]);
                        }
                    });
                }

                // Sotah two-column / marked modes: render Vienna and Erfurt as a
                // synoptic table of aligned rows so the columns stay parallel
                // line-to-line. (Notes mode is handled by the early branch above.)
                let synopticEl = null;
                if (chapterIsKiy && (sotahMode === 'two-col' || sotahMode === 'marked')) {
                    const firstNote = variantsArray[perekIndex][halachaIndex] && variantsArray[perekIndex][halachaIndex][0];
                    const erfurtRaw = extractErfurtText(firstNote);
                    if (erfurtRaw) {
                        const viennaPlain = textItem.replace(/<i data-commentator="Variants"[^>]*><\/i>/g, '');
                        const viennaTokens = tokenizeHe(viennaPlain);
                        const erfurtTokens = tokenizeHe(erfurtRaw);
                        const rows = buildAlignedRows(erfurtTokens, viennaTokens);
                        const marked = sotahMode === 'marked';
                        synopticEl = document.createElement('div');
                        synopticEl.className = 'kiy-synoptic';
                        synopticEl.innerHTML = rows.map(row => {
                            const vText = row.v.join(' ');
                            const eText = row.e.join(' ');
                            let vCls = 'syn-v', eCls = 'syn-e';
                            if (marked) {
                                if (row.tag === 'equal') { eCls += ' syn-match'; }
                                else if (row.tag === 'insert') { vCls += ' syn-vonly'; }
                                else { eCls += ' syn-diff'; }
                            }
                            return `<div class="syn-row syn-${row.tag}">` +
                                `<div class="${vCls}">${vText}</div>` +
                                `<div class="${eCls}">${eText}</div>` +
                                `</div>`;
                        }).join('');
                    }
                }

                // Containers for visible and hidden variants
                const variantParagraph = document.createElement('div');
                variantParagraph.className = 'variant-content';

                const hiddenVariantParagraph = document.createElement('div');
                hiddenVariantParagraph.className = 'hidden-variant-content';

                if (variantsArray[perekIndex] && variantsArray[perekIndex][halachaIndex]) {
                    if(!Array.isArray(variantsArray[perekIndex][halachaIndex])){
                        console.error("Not an array", [masechet, perekIndex, halachaIndex], variantsArray[perekIndex][halachaIndex]);
                    }
                    let noteIdx = 0;
                    variantsArray[perekIndex][halachaIndex].forEach(variantItem => {
                        const currentNoteIdx = noteIdx;
                        const noteId = `n-${perekIndex}-${halachaIndex}-${noteIdx}`;
                        noteIdx++;

                        const loc = [masechet, perekIndex, halachaIndex];
                        if (!variantItem.includes("|")) {
                            // Special-case the כי"ע Erfurt block: in Sotah 3-15 the
                            // first apparatus entry is the entire Erfurt parallel.
                            if (chapterIsKiy && typeof variantItem === 'string' && variantItem.startsWith('<b>כי"ע</b>')) {
                                if (sotahMode === 'two-col' || sotahMode === 'marked' || sotahMode === 'notes') {
                                    // Erfurt is shown elsewhere — column or notes panel.
                                    return;
                                }
                                if (sotahMode === 'collapse') {
                                    const erfurtText = extractErfurtText(variantItem) || '';
                                    variantParagraph.innerHTML += `<details class="kiy-block"><summary>כי"ע (קטע ערפורט)</summary><div>${erfurtText}</div></details> `;
                                    return;
                                }
                            }
                            console.log("No pipe",loc,variantItem);
                            variantParagraph.innerHTML += `<span class="note-span" data-note-id="${noteId}"><sup>*</sup> ${variantItem}</span> `;
                            return;
                        }
                        const parsedNote = parseNote3(variantItem,loc);
                        if (parsedNote) {
                            let sv, vars, affirmingWitnesses;
                            if (parsedNote.length == 2) {
                                [sv, vars] = parsedNote;
                            } else if(parsedNote.length == 3) {
                                [sv, vars, affirmingWitnesses] = parsedNote;
                            } else {
                                total_count++;
                                variantParagraph.innerHTML += `<span class="note-span" data-note-id="${noteId}">${variantItem}</span> `;
                                return;
                            }

                            // Apparatus inversion: when an eclectic swap has been
                            // applied AND the swap is not an omission (which has no
                            // word to make a new lemma from), swap the lemma and the
                            // alt reading. The new lemma is the alt text; the new
                            // reading is the body text (Vienna's reading), cited
                            // for ב alone since by definition only ב supported it.
                            // For omission swaps we keep the original apparatus —
                            // the existing 'LEMMA | ד א ח'.' format already reads
                            // naturally for the deletion case.
                            const swap = swapMap.get(currentNoteIdx);
                            if (swap && swap.applied && !swap.isOmission) {
                                const origLemma = sv[0];
                                vars = vars.map(([w, t]) => {
                                    if (w === swap.altWitnesses && (t || '').replace(/<[^>]+>/g, '').trim() === swap.altText) {
                                        return ["ב", origLemma];
                                    }
                                    return [w, t];
                                });
                                sv = [swap.altText, sv[1]];
                            }

                            // Build SV header fragment (inline)
                            let svFrag = `<b>${sv[0]}`;
                            if (sv[1]) {
                                svFrag += ` ${sv[1]}`;
                            }
                            svFrag += `</b>`;
                            if (affirmingWitnesses) {
                                svFrag += ` <span class="note-affirming">כ׳׳ה ${affirmingWitnesses}.</span>`;
                            }

                            // Classify each variant reading as visible or hidden
                            const multiwitness = isMultiWitness(vars);
                            const visibleParts = [];
                            const hiddenParts = [];

                            vars.forEach(([witnesses, varText]) => {
                                const decision = shouldHideVariant(
                                    sv[0],
                                    varText,
                                    {
                                        hideSoleWitnessSigla,
                                        readingWitnesses: witnesses,
                                        hiddenCategories,
                                        hiddenReasonDetails
                                    },
                                    multiwitness
                                );

                                // data-witnesses lets a click on THIS specific reading (one of
                                // possibly several per note, e.g. "ד: ... | ל: ...") be attributed
                                // to its own witness(es) -- e.g. so a non-Erfurt reading within an
                                // otherwise-mixed note doesn't focus the Erfurt manuscript viewer.
                                const part = `<span class="variant-reading" data-witnesses="${witnesses}"><span class="variant">${witnesses}</span>&nbsp;${varText}</span>`;

                                if (decision.hidden) {
                                    hiddenParts.push(part);
                                    hidden_count++;
                                } else {
                                    visibleParts.push(part);
                                }
                                total_count++;
                            });

                            // Render visible note (compact inline span with SV + readings)
                            if (visibleParts.length > 0) {
                                variantParagraph.innerHTML +=
                                    `<span class="note-span" data-note-id="${noteId}">${svFrag} | ${visibleParts.join(' ')}</span>` +
                                    `<span class="note-sep">․</span> `;
                            }

                            // Track notes where every reading is hidden
                            if (hiddenParts.length > 0 && visibleParts.length === 0) {
                                fullyHiddenNotes.add(noteId);
                            }

                            // Render hidden note with SV context
                            if (hiddenParts.length > 0) {
                                if (visibleParts.length === 0) {
                                    // All readings hidden — show full SV
                                    hiddenVariantParagraph.innerHTML +=
                                        `<span class="note-span" data-note-id="${noteId}">${svFrag} | ${hiddenParts.join(' ')}</span>` +
                                        `<span class="note-sep">․</span> `;
                                } else {
                                    // Some visible, some hidden — dimmed SV echo
                                    hiddenVariantParagraph.innerHTML +=
                                        `<span class="note-span" data-note-id="${noteId}"><span class="note-sv-echo">${sv[0]}</span> | ${hiddenParts.join(' ')}</span>` +
                                        `<span class="note-sep">․</span> `;
                                }
                            }
                        }
                    });
                }

                // In Sotah synoptic modes the aligned table replaces the V/E
                // body; the apparatus (other witnesses) still renders below
                // it. The general multi-witness synopsis (any tractate) lives
                // in the persistent footer instead of inline -- see
                // renderSynopsisFooter / syncFooterTo.
                if (synopticEl) {
                    paragraphPair.appendChild(synopticEl);
                } else {
                    paragraphPair.appendChild(textParagraph);
                }
                paragraphPair.appendChild(variantParagraph);
                paragraphPair.appendChild(hiddenVariantParagraph);

                if (chapterWitness && range && activeWitnessSigla.length) {
                    const strips = buildWitnessStrips(chapterWitness, range, activeWitnessSigla);
                    if (strips) paragraphPair.appendChild(strips);
                }

                contentContainer.appendChild(paragraphPair);
            });
        });
        document.getElementById('hidden_count').textContent = hidden_count;
        document.getElementById('total_count').textContent = total_count;
        // Show/hide hidden variants based on checkbox
        const hiddenVariants = document.getElementsByClassName('hidden-variant-content');
        for (let element of hiddenVariants) {
            element.style.display = showHiddenCheckbox.checked ? 'block' : 'none';
        }

        // Hide sup letters whose notes are fully filtered (unless showing hidden column)
        contentContainer.querySelectorAll('.note-ref').forEach(sup => {
            if (fullyHiddenNotes.has(sup.dataset.noteId) && !showHiddenCheckbox.checked) {
                sup.style.display = 'none';
            } else {
                sup.style.display = '';
            }
        });

        // Re-observe the rebuilt paragraphs so the commentary keeps following
        // the reader's scroll position. This runs on every updateDisplay, not
        // just on load: a filter change rebuilds the whole body, which would
        // otherwise leave the follower watching detached elements.
        viewer.scrollFollower.setContext(viewer.context);

        // Inline layers decorate the finished body. They run last, after the
        // words have been wrapped and the overlays inserted, because what they
        // add is measured off the rendered text -- the parallels layer's extent
        // bars need to know where the lines actually broke.
        applyInlineLayers();
    }

    // Inline layers must also be re-applied without rebuilding the body, for
    // changes that only affect them (switching subunit division on). Whether a
    // layer is on is the registry's business, so this just asks it.
    function applyInlineLayers() {
        const container = document.getElementById('content-container');
        const enabled = viewer.inline();
        if (!enabled.length) {
            container.querySelectorAll('.parallel-gutter, .parallel-subunit-break')
                .forEach(el => el.remove());
            document.body.classList.remove('parallel-extents-on');
            return;
        }
        enabled.forEach(layer => {
            try { layer.decorate(container, viewer.context); }
            catch (err) { console.error(`[layer ${layer.id}] decorate failed`, err); }
        });
    }
    refreshInlineLayers = applyInlineLayers;

    // A filter change alters which parallels exist, so far as every consumer is
    // concerned. The dock panel re-answers its own selection (it subscribes to
    // the filter directly, so it keeps the reader's place); the gutter bars have
    // to be redrawn, since lane packing is computed over the survivors. In
    // beside-mode the parallels are the page layout -- rows of text built around
    // them -- and that can only be rebuilt from the top.
    function onParallelsFilterChange() {
        if (viewer.context.parallelsBeside) {
            document.body.classList.remove('parallels-beside');
            updateDisplay();
        } else {
            applyInlineLayers();
        }
    }

    // Initial display
    updateDisplay();
    refreshCurrentDisplay = updateDisplay;

    // Add event listeners to checkboxes
    [
        showHiddenCheckbox,
        hideMinorOrthographyCheckbox,
        hideNameOrthographyCheckbox,
        hideMinorCheckbox,
        hideOtherMinorCheckbox,
        hideCitationScopeCheckbox,
        hideRoutineCheckbox,
        hideMorphologyCheckbox,
        document.getElementById('hideSoleWitness'),
        document.getElementById('hideParagraphBreak'),
        document.getElementById('paragraphBreakLineBreaks'),
        document.getElementById('eclecticText')
    ].forEach(cb => {
        cb.onchange = updateDisplay;
    });
    document.querySelectorAll('.hide-sole-witness-siglum').forEach(cb => {
        cb.onchange = updateDisplay;
    });
    document.querySelectorAll('input[name="sotahMode"]').forEach(rb => {
        rb.onchange = updateDisplay;
    });
    document.querySelectorAll('.witness-strip-toggle').forEach(cb => {
        cb.onchange = updateDisplay;
    });
    // .onclick (property assignment, not addEventListener) so re-running this
    // on every tractate load overwrites the previous handler instead of
    // stacking duplicates -- same safety the old .onchange assignment had.
    document.getElementById('synopsisMode').onclick = () => {
        setNavToggleOn('synopsisMode', !isNavToggleOn('synopsisMode'));
        updateDisplay();
    };
    // A dock layer's toggle no longer re-renders the body: switching an
    // apparatus panel on is not a reason to rebuild several thousand words of
    // text and re-run the variant classification over it.
    document.getElementById('manuscriptMode').onclick = () => viewer.toggle('manuscript');
    // One button, every commentary: opens the dock with a tab per commentary
    // that has data for this tractate, and shuts them all.
    document.getElementById('commentaryMode').onclick = () => viewer.toggleNavGroup('commentaryMode');
    document.getElementById('parallel-subunits').onchange = (e) => {
        viewer.setContext({ ...viewer.context, parallelSubunits: e.target.checked });
        applyInlineLayers();
    };
    // One control for showing the parallels and for where they sit, because the
    // two cannot be allowed to disagree -- and as a header button plus a radio
    // pair they did, in both directions. See the note on the section markup.
    //
    // Every transition here needs a full re-render, including switching OFF.
    // That is not conservatism: beside-mode moves rendered nodes (the text into
    // per-subunit rows, the variants into a band of their own), and a decorate
    // pass that draws nothing cannot put back what layoutParallelsBeside already
    // moved. Leaving the layer to "switch itself off" is exactly what stranded a
    // full apparatus on the page under a control reading "hidden".
    document.querySelectorAll('input[name="parallels-mode"]').forEach(radio => {
        radio.onchange = () => {
            if (!radio.checked) return;
            parallelsBesideState = radio.value === 'beside';
            try {
                localStorage.setItem(PARALLELS_BESIDE_KEY, parallelsBesideState ? '1' : '0');
            } catch { /* ignore */ }
            document.body.classList.remove('parallels-beside');
            // Context first, then the re-render: updateDisplay rebuilds the body
            // and hands the layers whatever ctx currently says, so setting the
            // flag afterwards would decorate this pass with the previous answer.
            viewer.setContext({ ...viewer.context, parallelsBeside: parallelsBesideState });
            viewer.setEnabled('parallel-extents', radio.value !== 'off');
            syncParallelsModeRadio();
            refreshCurrentDisplay();
        };
    });
    ['vilna', 'lz'].forEach(key => {
        document.getElementById(`numbering-overlay-${key}`).onchange = (e) => {
            editionOverlayState[key] = e.target.checked;
            updateDisplay();
        };
    });

}

    </script>
</body>
</html>
