<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Suez+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/midrash-viewer-core/midrash-viewer-core.css?v=10">
    <link rel="stylesheet" href="styles.css?v=32">
    <title>תוספתא עם חילופי נוסח</title>
</head>
<body>
    <header class="site-header">
        <div class="header-title">
            <!-- Opens #sidebar, which drops down from under this button rather
                 than holding a 280px column open all day. See .sidebar. -->
            <button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false"
                    aria-controls="sidebar" aria-label="הגדרות וסינון" title="הגדרות וסינון">☰</button>
            <!-- Mobile-only: opens the perek/halakhah TOC as a drawer, since
                 .toc-nav's own sticky column has no room on a phone (see the
                 mobile rules for .toc-nav). Shown only once the TOC has content
                 AND we're at a mobile width -- see syncTocToggleVisibility. On
                 desktop the TOC is permanently visible in its own column, so
                 this button had nothing to open: clicking it added .open (a
                 no-op there) and switched on the modal dimming backdrop, which
                 dimmed the page for nothing. -->
            <button class="toc-toggle" id="toc-toggle" aria-label="ניווט לפי פרקים והלכות" title="ניווט לפי פרקים והלכות" hidden>📖</button>
            <!-- Which apparatus registers are showing. A dropdown for the same
                 reason the settings are one: these are occasional gestures --
                 a panel is opened, read for a while, and closed by its own ✕ --
                 so a rail standing down the edge of every page was permanent
                 chrome bought for an intermittent need.
                 Hidden when the loaded tractate has no register at all, and
                 filled while any is open, so the header still answers "is
                 anything beside the text?" without being opened. Both are
                 derived from the registry, in the same pass as the buttons
                 inside it -- see registry.onChange in viewer_layers.js. -->
            <div class="header-menu" id="apparatus-menu-wrap" hidden>
                <button type="button" class="header-menu-btn" id="apparatus-menu-toggle"
                        aria-expanded="false" aria-controls="apparatus-menu"
                        title="תצוגות נלוות לטקסט" aria-label="תצוגות נלוות לטקסט">תצוגות</button>
                <div class="header-dropdown" id="apparatus-menu">
                    <button type="button" class="nav-toggle-btn" id="synopsisMode" hidden aria-pressed="false"
                            title="תצוגת סינופסיס -- השוואת עדי הנוסח בטבלה">סינופסיס</button>
                    <button type="button" class="nav-toggle-btn" id="manuscriptMode" hidden aria-pressed="false"
                            title="צילומי כתבי היד">כתבי יד</button>
                    <!-- One button for every commentary: they share a dock and
                         appear as tabs within it, so a button apiece was both
                         redundant and unscalable (four commentaries are coming). -->
                    <button type="button" class="nav-toggle-btn" id="commentaryMode" hidden aria-pressed="false"
                            title="פירושים">פירושים</button>
                </div>
            </div>
            <h1>תוספתא עם חילופי נוסח</h1>
        </div>
        <div class="masechet-selector">
            <label for="masechet-dropdown">בחירת מסכת:</label>
            <select id="masechet-dropdown"></select>
            <button id="load-masechet">טען</button>
            <span class="edition-note" id="edition-note" hidden></span>
        </div>
        <!-- Nothing else. What used to sit here -- the אוצר link and the Word
             export -- has moved into #sidebar under a divider: neither is a
             reading control, and neither was worth a permanent seat. -->
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Settings and filters. A dropdown from under the ☰ button rather than the
         280px column this used to be: the filters are set once and then read
         past, so holding a fifth of the window open for them all session cost
         the reading column far more than it was worth. Outside .page-layout
         because it is no longer one of its columns -- it overlays the page and
         reserves no width at all.
         Still called "sidebar" throughout (id, .sidebar-tabs, .sidebar-pane):
         renaming it would touch every rule and handler for no gain. -->
    <aside class="sidebar" id="sidebar">
            <!-- Two settings pages, not one long scroll. The variants filters and
                 the parallels filters are answers to different questions -- what
                 counts as a meaningful difference between witnesses, and which
                 of the parallel literature is worth citing here -- and stacking
                 them buried whichever one the reader wasn't using. The parallels
                 tab is hidden entirely for a tractate with no parallels data. -->
            <div class="sidebar-tabs" role="tablist">
                <button type="button" class="sidebar-tab active" role="tab"
                        data-pane="sidebar-pane-text" aria-selected="true">נוסח</button>
                <button type="button" class="sidebar-tab" role="tab" id="sidebar-tab-parallels"
                        data-pane="sidebar-pane-parallels" aria-selected="false" hidden>מקבילות</button>
            </div>

            <div class="sidebar-pane active" id="sidebar-pane-text" role="tabpanel">
            <section class="filters-section sotah-panel" id="sotah-panel" hidden>
                <div class="panel-title">תצוגת סוטה (כי״ע)</div>
                <label><input type="radio" name="sotahMode" value="default" checked> רגיל</label>
                <label><input type="radio" name="sotahMode" value="collapse"> כיווץ קטע ערפורט</label>
                <label><input type="radio" name="sotahMode" value="two-col"> שתי עמודות</label>
                <label><input type="radio" name="sotahMode" value="marked"> שתי עמודות עם סימון</label>
                <label><input type="radio" name="sotahMode" value="notes"> הערות שוליים</label>
            </section>

            <section class="filters-section witness-panel" id="witness-panel" hidden>
                <div class="panel-title">עדי נוסח מלאים</div>
                <label><input type="checkbox" class="witness-strip-toggle" data-siglum="א"> א <span class="detail-count">(ערפורט)</span></label>
                <label><input type="checkbox" class="witness-strip-toggle" data-siglum="ב"> ב <span class="detail-count">(וינה)</span></label>
                <label><input type="checkbox" class="witness-strip-toggle" data-siglum="ד"> ד <span class="detail-count">(דפוס)</span></label>
                <label><input type="checkbox" class="witness-strip-toggle" data-siglum="ל"> ל <span class="detail-count">(לונדון)</span></label>
                <label><input type="checkbox" class="witness-strip-toggle" data-siglum="ג"> ג <span class="detail-count">(קטעי גניזה)</span></label>
                <label><input type="checkbox" class="witness-strip-toggle" data-siglum="ש"> ש <span class="detail-count">(שוקן, קטעי)</span></label>
            </section>

            <section class="filters-section numbering-panel" id="numbering-panel" hidden
                      title="הצג היכן מהדורה אחרת פותחת פרק/הלכה, כשכבת־על מעל הטקסט שלנו -- מוצג רק כשהחלוקה של אותה מהדורה שונה משלנו במסכת הנוכחית">
                <div class="panel-title">חלוקה לפי מהדורה אחרת</div>
                <label id="numbering-overlay-vilna-wrap" hidden><input type="checkbox" id="numbering-overlay-vilna"> וילנא</label>
                <label id="numbering-overlay-lz-wrap" hidden><input type="checkbox" id="numbering-overlay-lz"> צוקרמנדל</label>
            </section>

            <section class="filters-section">
                <details open>
                    <summary>סינון חילופים</summary>
                    <label class="filter-toggle"><input type="checkbox" id="showHidden"> הצג חילופים מוסתרים</label>

                    <div class="filter-body">
                        <label class="filter-parent"><input type="checkbox" id="eclecticText"> טקסט אקלקטי <span class="detail-count">(לא תכירו פְנים)</span></label>
                        <details class="filter-collapse">
                            <summary><label class="filter-parent"><input type="checkbox" id="hideParagraphBreak" checked onclick="event.stopPropagation()"> הסתר ציוני פתוח/סתום</label></summary>
                            <div class="filter-extra">
                                <label><input type="checkbox" id="paragraphBreakLineBreaks"> הצג שורה חדשה במקום פתוח</label>
                            </div>
                        </details>
                        <details class="filter-collapse">
                            <summary><label class="filter-parent"><input type="checkbox" id="hideSoleWitness" onclick="event.stopPropagation()"> הסתר חילופים של עד בודד</label></summary>
                            <div class="filter-children" data-parent="hideSoleWitness">
                                <label><input type="checkbox" class="hide-sole-witness-siglum" data-siglum="א"> רק א <span class="detail-count">(ערפורט)</span></label>
                                <label><input type="checkbox" class="hide-sole-witness-siglum" data-siglum="ד"> רק ד <span class="detail-count">(דפוס)</span></label>
                                <label><input type="checkbox" class="hide-sole-witness-siglum" data-siglum="ל"> רק ל <span class="detail-count">(לונדון)</span></label>
                                <label><input type="checkbox" class="hide-sole-witness-siglum" data-siglum="ג"> רק ג <span class="detail-count">(קטעי גניזה)</span></label>
                                <label><input type="checkbox" class="hide-sole-witness-siglum" data-siglum="ש"> רק ש <span class="detail-count">(שוקן, קטעי)</span></label>
                                <label><input type="checkbox" class="hide-sole-witness-siglum" data-siglum="ב"> רק ב <span class="detail-count">(וינה)</span></label>
                            </div>
                        </details>

                        <!-- Hidden by default: כתיב חלופי (מלא/חסר, ם/ן, קיצורים) and the
                             known letter-swap pairs under חילופי אותיות are spelling, not
                             readings. Leaving them on makes a page of apparatus out of
                             orthography and buries the variants a reader came for; both
                             rows untick in one click, and "הצג חילופים מוסתרים" brings
                             them back marked. -->
                        <label class="filter-parent"><input type="checkbox" id="hideMinorOrthography" checked> כתיב חלופי</label>
                        <div class="filter-children" data-parent="hideMinorOrthography">
                            <div class="detail-slot" data-category="minor_orthography"></div>
                        </div>
                        <label class="filter-parent"><input type="checkbox" id="hideNameOrthography"> כתיב שמות</label>
                        <div class="filter-children" data-parent="hideNameOrthography">
                            <div class="detail-slot" data-category="name_orthography"></div>
                        </div>
                        <label class="filter-parent"><input type="checkbox" id="hideMinor" checked> חילופי אותיות</label>
                        <div class="filter-children" data-parent="hideMinor">
                            <div class="detail-slot" data-category="minor"></div>
                        </div>
                        <label class="filter-parent"><input type="checkbox" id="hideOtherMinor"> שינויים בינוניים</label>
                        <div class="filter-children" data-parent="hideOtherMinor">
                            <div class="detail-slot" data-category="other_minor"></div>
                        </div>
                        <label class="filter-parent"><input type="checkbox" id="hideCitationScope"> היקף ציטוט</label>
                        <div class="filter-children" data-parent="hideCitationScope">
                            <div class="detail-slot" data-category="citation_scope"></div>
                        </div>
                        <!-- Corpus-mined swaps that recur across enough tractates and
                             witnesses to be scribal habit (אינו/אין, זה/זו). Visible by
                             default: statistically routine, but some change local meaning. -->
                        <label class="filter-parent"><input type="checkbox" id="hideRoutine"> חילופים שגרתיים</label>
                        <div class="filter-children" data-parent="hideRoutine">
                            <div class="detail-slot" data-category="routine"></div>
                        </div>
                        <label class="filter-parent"><input type="checkbox" id="hideMorphology"> חילופי נטייה</label>
                        <div class="filter-children" data-parent="hideMorphology">
                            <div class="detail-slot" data-category="morphology"></div>
                        </div>
                    </div>

                    <div class="status-bar">
                        הוסתרו <strong><span id="hidden_count">0</span></strong> חילופים מתוך <strong><span id="total_count">0</span></strong>
                    </div>
                </details>
            </section>
            </div><!-- /sidebar-pane-text -->

            <div class="sidebar-pane" id="sidebar-pane-parallels" role="tabpanel" hidden>
                <!-- Both registers of the apparatus live in the halakhah they
                     belong to. What the reader chooses is which of them holds the
                     column level with the text: the other stacks in a band below
                     it, in the same paragraph, always visible. Neither is hidden
                     and neither is in a far margin -- that split is what this
                     control replaced.
                     Showing the parallels at all is the FIRST of these three
                     options rather than a separate button in the header, because
                     the two cannot be allowed to disagree and as separate
                     controls they did: the button governed the inline layer's
                     decorate pass, while beside-mode is baked into the render by
                     layoutParallelsBeside. Switching the button off therefore
                     left a whole parallels apparatus on the page reading "off",
                     and choosing "beside" while it was off silently rendered
                     nothing. One control cannot contradict itself. -->
                <section class="filters-section parallels-panel-options" id="parallels-options-panel">
                    <div class="panel-title">תצוגת המקבילות</div>
                    <label title="המקבילות אינן מוצגות כלל"><input type="radio" name="parallels-mode" id="parallels-mode-off" value="off" checked> מוסתרות</label>
                    <label title="המקבילות ברצועה שמתחת להלכה, וחילופי הנוסח בטור שלצד הטקסט"><input type="radio" name="parallels-mode" id="parallels-mode-band" value="band"> ברצועה שמתחת להלכה</label>
                    <label title="המקבילות בטור שלצד הטקסט, כל אחת בגובה המילים שהיא מכסה, ולחיצה פותחת את לשונה במקום; חילופי הנוסח עוברים לרצועה שמתחת להלכה"><input type="radio" name="parallels-mode" id="parallels-mode-beside" value="beside"> בטור שלצד הטקסט</label>
                    <!-- Only meaningful in band mode: beside-mode does its own
                         splitting (layoutParallelsBeside puts every measured
                         extent in its own row), and there is nothing to split
                         when the parallels are hidden. -->
                    <label class="filter-parent" title="חלוקת ההלכה לתת־יחידות לפי ראשי המקבילות -- החלוקה להלכות נשארת כשהיתה"><input type="checkbox" id="parallel-subunits" disabled> חלוקה לתת־יחידות לפי המקבילות</label>
                </section>

                <!-- Built from the loaded tractate's own parallels, so the rows
                     and their counts differ per tractate: see
                     renderParallelsFilterUI in parallels_layer.js. -->
                <div id="parallels-filters"></div>
            </div><!-- /sidebar-pane-parallels -->

        <!-- Page-level actions, below a divider and outside both panes so they
             show whichever tab is open. They are not filters and not reading
             controls -- one leaves the page and one produces a file -- which is
             why they read as a short menu at the foot of the panel rather than
             as more settings. -->
        <div class="sidebar-actions">
            <a class="sidebar-action" href="otzarHaHilufim.html">אוצר החילופים</a>
            <button type="button" id="export-docx" class="sidebar-action nav-export"
                    title="ייצוא ל‑Word" aria-label="ייצוא ל‑Word">
                <span class="nav-export-mark"><span class="nav-export-w">W</span><span class="nav-export-arrow">↓</span></span>
                ייצוא ל‑Word
            </button>
        </div>
    </aside>

    <div class="page-layout">
        <!-- Perek/Halakha navigation -->
        <nav class="toc-nav" id="toc-nav"></nav>

        <!-- Main content area -->
        <div class="main-content">
            <section class="card" id="app">
                <div id="content-container"></div>
            </section>

        </div>

    </div>

    <div class="bottom-panels" id="bottom-panels">
        <div class="synopsis-footer" id="synopsis-footer" hidden>
            <div class="synopsis-footer-header">
                <button type="button" id="synopsis-prev" title="הלכה קודמת">▶</button>
                <span id="synopsis-footer-label" class="synopsis-footer-label"></span>
                <button type="button" id="synopsis-next" title="הלכה הבאה">◀</button>
                <label class="synopsis-footer-toggle"><input type="checkbox" id="synopsisShowChapter"> הצג פרק שלם</label>
                <button type="button" id="synopsis-footer-close" class="synopsis-footer-close" title="סגור">✕</button>
            </div>
            <div class="synopsis-footer-body" id="synopsis-footer-body"></div>
        </div>

        <!-- Dock region: chrome (header, tabs, close) comes from
             midrash-viewer-core's createDock; the manuscript-image layer mounts
             its panel inside. Zoom / fullscreen controls are the shared panel's
             own, inside the dock body. -->
        <div class="dock-region" id="manuscript-dock" hidden></div>
    </div>

    <!-- Commentaries dock. Tall rather than wide: commentary runs in long
         paragraphs (Tosefta Kifshuta's notes carry their own footnotes), which
         needs vertical room and would wreck the reading column if inlined.
         This is the one dock expected to host several layers at once, so it's
         where the tab strip actually earns its keep. -->
    <aside class="side-dock dock-region" id="side-dock" hidden></aside>

    <!-- Mobile-only tab bar. Empty until JS relocates the panel-toggle
         buttons into it below a certain width -- see the bottom-tabbar script
         near the sidebar-toggle wiring. Reachable at the bottom of the screen
         without a trip back up to the header, and desktop is untouched since
         nothing ever moves there above the breakpoint. -->
    <nav class="bottom-tabbar" id="bottom-tabbar" hidden></nav>

    <script src="vendor/midrash-viewer-core/midrash-viewer-core.js?v=10"></script>
    <script src="tosefta_parsing_tools.js?v=19"></script>
    <script src="parallels_layer.js?v=26"></script>
    <script src="viewer_layers.js?v=14"></script>
    <script>
        let currentTextData = null;
        let currentVariantsData = null;
        let currentWitnessData = null;
        let currentManuscriptData = null;
        let currentEditionsData = null;
        let currentParallelsData = null;
        let currentCommentaryData = null;
        // Which alternate-edition overlays are toggled on; persists across tractate loads
        // within the page (each tractate load hides/unchecks whichever is native there).
        let editionOverlayState = { vilna: false, lz: false };
        // Which of the two parallels display modes was last chosen. Held here and
        // persisted, rather than read back off the radio, because the radio is a
        // VIEW of this plus the registry's restored layer intent -- see
        // syncParallelsModeRadio. Reading the DOM instead would make the control
        // the store, and on the first load it is set before anything has chosen.
        const PARALLELS_BESIDE_KEY = 'tosefta.parallels.beside';
        let parallelsBesideState = false;
        try { parallelsBesideState = localStorage.getItem(PARALLELS_BESIDE_KEY) === '1'; } catch { /* ignore */ }
        let refreshCurrentDisplay = null;
        // Re-runs the inline apparatus layers over the already-rendered body,
        // for options that change only what they draw.
        let refreshInlineLayers = null;

        // --- Header dropdowns / TOC drawer ---
        // Three overlays compete for the same screen and share one backdrop: the
        // settings dropdown (☰), the apparatus dropdown (תצוגות) and -- on
        // mobile only -- the perek/halakhah TOC drawer. Exactly one is ever
        // open. Rather than each toggle remembering to close the other two, they
        // all go through openPanel(), which is also what the backdrop, Escape
        // and the mobile-breakpoint handler call. Nothing about which panels
        // exist is encoded in more than one place.
        //
        // Both dropdowns are dropdowns at EVERY width, so there is one
        // open/close path where there used to be a split: desktop hid a layout
        // column (body.sidebar-collapsed) and mobile slid an off-canvas drawer.
        const sidebarEl = document.getElementById('sidebar');
        const sidebarToggleBtn = document.getElementById('sidebar-toggle');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const tocNavEl = document.getElementById('toc-nav');
        const tocToggleBtn = document.getElementById('toc-toggle');
        const apparatusMenuEl = document.getElementById('apparatus-menu');
        const apparatusMenuBtn = document.getElementById('apparatus-menu-toggle');

        // A panel and the button that owns it. The TOC drawer's opener lives in
        // the bottom tab bar and carries no expanded state of its own, hence the
        // null trigger.
        const OVERLAY_PANELS = [
            { el: sidebarEl, trigger: sidebarToggleBtn },
            { el: apparatusMenuEl, trigger: apparatusMenuBtn },
            { el: tocNavEl, trigger: null },
        ];

        // The backdrop is what makes clicking anywhere else dismiss a panel. It
        // is invisible on desktop (a dropdown that dimmed the page would read as
        // a modal, which these are not) and dimmed on mobile, where a panel
        // covers most of the screen -- see .sidebar-overlay.
        //
        // `which` is the element to leave open, or null to close everything. A
        // trigger reads pressed only while its own panel is open, so a stale
        // "expanded" is not expressible.
        function openPanel(which) {
            OVERLAY_PANELS.forEach(({ el, trigger }) => {
                const on = el === which;
                el.classList.toggle('open', on);
                if (!trigger) return;
                trigger.classList.toggle('active', on);
                trigger.setAttribute('aria-expanded', on ? 'true' : 'false');
            });
            sidebarOverlay.classList.toggle('visible', !!which);
        }
        function togglePanel(el) {
            openPanel(el.classList.contains('open') ? null : el);
        }
        function closeDrawers() { openPanel(null); }

        sidebarToggleBtn.addEventListener('click', () => togglePanel(sidebarEl));
        apparatusMenuBtn.addEventListener('click', () => togglePanel(apparatusMenuEl));
        tocToggleBtn.addEventListener('click', () => togglePanel(tocNavEl));
        sidebarOverlay.addEventListener('click', closeDrawers);
        // The backdrop deliberately stops below the header (see .sidebar-overlay),
        // so clicks up there never reach it. Anything in the bar that is not a
        // menu handle or inside an open menu still counts as clicking away.
        document.querySelector('.site-header').addEventListener('click', (e) => {
            if (e.target.closest('#sidebar-toggle, #toc-toggle, #apparatus-menu-wrap')) return;
            closeDrawers();
        });
        // Escape is the expected way out of a dropdown, and the only one that
        // does not require finding the backdrop or the button again. Focus goes
        // back to whichever trigger opened the panel, not to a fixed one.
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            const open = OVERLAY_PANELS.find(p => p.el.classList.contains('open'));
            if (!open) return;
            closeDrawers();
            if (open.trigger) open.trigger.focus();
        });
        // Choosing a register is a one-shot gesture: the panel it opens is what
        // the reader wanted to look at, and leaving the menu hanging over it
        // would just be something else to dismiss. Closing on the button's own
        // click (not on any click inside) keeps the menu open if a future
        // control in here is one you'd adjust repeatedly.
        apparatusMenuEl.querySelectorAll('.nav-toggle-btn').forEach(btn => {
            btn.addEventListener('click', closeDrawers);
        });

        // The trigger is a summary of its own menu: shown only while the menu has
        // at least one entry, and filled while any of them is on, so the header
        // answers "is anything beside the text?" without being opened.
        //
        // Derived from the BUTTONS, by id, not from the layer registry. Two
        // reasons, and both matter: the synopsis is still hand-wired rather than
        // a registry layer, so the registry cannot see it at all (its `hidden` is
        // set by updateDisplay) -- summarising from the registry hid the whole
        // menu, synopsis included, on any tractate with witnesses but no images
        // and no commentary. And reading by id survives the buttons being
        // reparented into .bottom-tabbar on mobile, which a container query would
        // not. Called from both places that can change a button.
        const APPARATUS_BUTTON_IDS = ['synopsisMode', 'manuscriptMode', 'commentaryMode'];
        function syncApparatusMenu() {
            const buttons = APPARATUS_BUTTON_IDS
                .map(id => document.getElementById(id))
                .filter(Boolean);
            const shown = buttons.filter(b => !b.hidden);
            document.getElementById('apparatus-menu-wrap').hidden = shown.length === 0;
            apparatusMenuBtn.classList.toggle(
                'has-open', shown.some(b => b.classList.contains('active')));
            // An open menu with nothing left in it (a tractate switch can empty
            // it) would be an empty box hanging off a hidden button.
            if (!shown.length && apparatusMenuEl.classList.contains('open')) openPanel(null);
        }

        // The panel hangs off the bottom of the header, whose height is not
        // fixed: it wraps to two or three rows on a narrow screen. Publish the
        // measured height so the dropdown (and .side-dock, which had been
        // making do with the 3.5rem fallback) can anchor to the real edge
        // instead of a guess.
        (function () {
            const header = document.querySelector('.site-header');
            if (!header || typeof ResizeObserver === 'undefined') return;
            const publish = () => document.documentElement.style.setProperty(
                '--site-header-height', `${header.offsetHeight}px`);
            new ResizeObserver(publish).observe(header);
            publish();
        })();

        // Below the breakpoint the TOC has no column of its own and this button
        // is the only way to it; above it the TOC is always on screen and the
        // button is not merely redundant but harmful, since opening a drawer
        // that is already visible leaves only the dimming backdrop behind. Both
        // conditions have to hold, so both are checked in one place and
        // re-checked whenever either can change -- a tractate load (content) or
        // a viewport crossing (width).
        const MOBILE_MQ = window.matchMedia('(max-width: 900px)');
        let tocHasContent = false;
        function syncTocToggleVisibility() {
            tocToggleBtn.hidden = !(tocHasContent && MOBILE_MQ.matches);
        }
        MOBILE_MQ.addEventListener('change', syncTocToggleVisibility);
        syncTocToggleVisibility();

        // --- Sidebar tabs ---
        function showSidebarPane(paneId) {
            document.querySelectorAll('.sidebar-tab').forEach(tab => {
                const on = tab.dataset.pane === paneId;
                tab.classList.toggle('active', on);
                tab.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            document.querySelectorAll('.sidebar-pane').forEach(pane => {
                pane.hidden = pane.id !== paneId;
                pane.classList.toggle('active', pane.id === paneId);
            });
        }
        document.querySelectorAll('.sidebar-tab').forEach(tab => {
            tab.addEventListener('click', () => showSidebarPane(tab.dataset.pane));
        });

        // --- Mobile bottom tab bar ---
        // Relocates the panel-toggle controls (sidebar, TOC, synopsis,
        // manuscript, commentary) into a fixed bar at the bottom of the screen
        // below the responsive breakpoint, where they're thumb-reachable without
        // a trip back up the page. On a phone the register toggles come OUT of
        // the תצוגות dropdown and sit directly in the bar -- a dropdown reached
        // from a bar that is already one tap away would be a tap for nothing --
        // which is why #apparatus-menu-wrap hides itself at this width (CSS) and
        // its buttons are listed here.
        //
        // Moves the actual elements rather than cloning them: viewer_layers.js's
        // nav-button sync (hidden/active state) and this file's own click
        // listeners above are keyed to these same ids, so cloning would either
        // duplicate ids or need a second sync path. Reparenting a node keeps its
        // id and listeners intact, and `parent`/`next` are captured before any
        // move so putting them back is exact.
        (function () {
            const bar = document.getElementById('bottom-tabbar');
            const homes = ['sidebar-toggle', 'toc-toggle', 'synopsisMode', 'manuscriptMode', 'commentaryMode']
                .map(id => document.getElementById(id))
                .filter(Boolean)
                .map(el => ({ el, parent: el.parentNode, next: el.nextSibling }));

            function apply(isMobile) {
                closeDrawers();
                if (isMobile) {
                    homes.forEach(h => bar.appendChild(h.el));
                    bar.hidden = false;
                } else {
                    homes.forEach(h => h.parent.insertBefore(h.el, h.next));
                    bar.hidden = true;
                }
            }
            apply(MOBILE_MQ.matches);
            MOBILE_MQ.addEventListener('change', e => apply(e.matches));
        })();

        // --- Parent/child filter interaction ---
        // Any checkbox whose id matches a filter-children[data-parent] dims that container when checked
        document.querySelectorAll('.filter-children[data-parent]').forEach(childrenContainer => {
            const parentId = childrenContainer.dataset.parent;
            const parentCb = document.getElementById(parentId);
            if (!parentCb) return;

            function syncChildren() {
                childrenContainer.classList.toggle('disabled', parentCb.checked);
            }

            parentCb.addEventListener('change', syncChildren);
            syncChildren();
        });

        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // Maps raw English reason strings to Hebrew display groups
        // Returns { key, hebrew } or null to suppress display
        function groupReason(reason) {
            if (!reason) return null;
            if (reason === 'both empty') return null;
            if (reason === 'substantive variant - needs review') return null;

            // Abbreviations
            if (reason.includes('abbreviation')) {
                return { key: 'abbreviation', hebrew: 'קיצורים' };
            }
            // Haser/maleh (but not "abbreviation + haser/maleh" which is caught above)
            if (reason.includes('haser/maleh')) {
                return { key: 'haser_maleh', hebrew: 'מלא/חסר' };
            }
            // Mem/nun
            if (reason.includes('mem/nun')) {
                return { key: 'mem_nun', hebrew: 'חלופי ם/ן' };
            }
            // Prefix differences
            if (reason.startsWith('prefix difference:')) {
                return { key: 'prefix_diff', hebrew: 'הבדלי תחיליות' };
            }
            // Prefix swaps
            if (reason.startsWith('prefix swap:')) {
                return { key: 'prefix_swap', hebrew: 'חילופי תחיליות' };
            }
            // Letter-swap orthography (minor category) — split per swap kind
            if (reason === 'orthography') {
                return { key: 'ortho_pair', hebrew: 'חילוף ידוע' };
            }
            if (reason === 'orthography: אי/יי') {
                return { key: 'ortho_alef_yod', hebrew: 'אי/יי' };
            }
            if (reason === 'orthography: ת/ה final') {
                return { key: 'ortho_tav_heh', hebrew: 'ת/ה סופית' };
            }
            if (reason === 'orthography: ה/ן final') {
                return { key: 'ortho_heh_nun', hebrew: 'ה/ן סופית' };
            }
            if (reason === 'orthography: א/ה final') {
                return { key: 'ortho_alef_heh', hebrew: 'א/ה סופית' };
            }
            if (reason.startsWith('orthography')) {
                return { key: 'orthography', hebrew: 'כתיב חלופי' };
            }
            if (reason === 'niqqud/punctuation only') return { key: 'niqqud_only', hebrew: 'ניקוד/פיסוק בלבד' };
            if (reason === 'phonetic spelling') return { key: 'phonetic', hebrew: 'כתיב פונטי' };
            // Rabbi name variants
            if (reason === 'rabbi name variant') {
                return { key: 'rabbi_name', hebrew: 'שמות חכמים' };
            }
            // Citation scope
            if (reason.startsWith('citation_scope:')) {
                return { key: 'citation_scope', hebrew: 'היקף ציטוט' };
            }
            // Corpus-mined routine scribal swaps
            if (reason.startsWith('routine swap')) {
                return { key: 'routine_swap', hebrew: 'חילופים שגרתיים' };
            }
            if (reason === 'inflection (same lexeme)') {
                return { key: 'inflection', hebrew: 'חילופי נטייה' };
            }
            if (reason === 'attested spelling') {
                return { key: 'attested_spelling', hebrew: 'כתיב מאומת' };
            }
            if (reason === 'divine name spelling') {
                return { key: 'divine_name', hebrew: 'כתיב שם ה\'' };
            }
            if (reason === 'numeral notation') {
                return { key: 'numeral', hebrew: 'סימון מספר' };
            }
            // Minor addition/omission
            if (reason.startsWith('minor addition/omission:')) {
                return { key: 'minor_add_omit', hebrew: 'תוספת/השמטה קלה' };
            }
            // Addition/omission (major)
            if (reason.startsWith('addition/omission:')) {
                return { key: 'add_omit', hebrew: 'תוספת/השמטה' };
            }
            // Word missing in witness (ח' / חסר)
            if (reason === 'omission') {
                return { key: 'omission', hebrew: 'חסר' };
            }
// Word order
            if (reason.startsWith('word order')) {
                return { key: 'word_order', hebrew: 'סדר מילים' };
            }
            // Fallback — show reason as-is
            return { key: reason, hebrew: reason };
        }

        // Hebrew label for an individual reason (used inside expanded groups)
        function reasonToHebrew(reason) {
            if (reason === 'abbreviation (kitzur)') return 'קיצור';
            if (reason === 'abbreviation + haser/maleh') return 'קיצור + מלא/חסר';
            if (reason === 'haser/maleh spelling') return 'כתיב מלא/חסר';
            if (reason === 'haser/maleh + mem/nun') return 'מלא/חסר + ם/ן';
            if (reason === 'mem/nun final swap') return 'חלופי ם/ן';
            if (reason.startsWith('prefix difference: ')) return 'תחילית: ' + reason.split(': ')[1];
            if (reason.startsWith('prefix swap: ')) return 'חילוף: ' + reason.split(': ')[1];
            if (reason === 'orthography') return 'כתיב';
            if (reason === 'niqqud/punctuation only') return 'ניקוד/פיסוק בלבד';
            if (reason === 'phonetic spelling') return 'כתיב פונטי';
            if (reason.startsWith('orthography: ')) return 'כתיב: ' + reason.split(': ')[1];
            if (reason === 'rabbi name variant') return 'שמות חכמים';
            if (reason.startsWith('citation_scope: marker only')) {
                const match = reason.match(/\((.+)\)/);
                return 'סמן: ' + (match ? match[1] : '');
            }
            if (reason.startsWith('minor addition/omission: ')) return 'תוספת/השמטה: ' + reason.split(': ')[1];
            if (reason.startsWith('addition/omission: ')) return 'תוספת/השמטה: ' + reason.split(': ')[1];
            if (reason.startsWith('routine swap: ')) return 'חילוף: ' + reason.split(': ')[1];
            if (reason === 'inflection (same lexeme)') return 'נטייה';
            if (reason === 'attested spelling') return 'כתיב מאומת';
            if (reason === 'divine name spelling') return 'כתיב שם ה\'';
            if (reason === 'numeral notation') return 'סימון מספר';
if (reason === 'word order difference') return 'סדר מילים';
            if (reason === 'word order difference (with prefixes)') return 'סדר מילים (עם תחיליות)';
            return reason;
        }

        function getHiddenCategoriesSet() {
            const hidden = new Set();
            if (document.getElementById('hideMinorOrthography').checked) hidden.add('minor_orthography');
            if (document.getElementById('hideNameOrthography').checked) hidden.add('name_orthography');
            if (document.getElementById('hideMinor').checked) hidden.add('minor');
            if (document.getElementById('hideOtherMinor').checked) hidden.add('other_minor');
            if (document.getElementById('hideCitationScope').checked) hidden.add('citation_scope');
            if (document.getElementById('hideRoutine').checked) hidden.add('routine');
            if (document.getElementById('hideMorphology').checked) hidden.add('morphology');
            if (document.getElementById('hideParagraphBreak').checked) hidden.add('paragraph_break');
            return hidden;
        }

        function getHiddenReasonDetailsSet() {
            const hidden = new Set();
            const checked = document.querySelectorAll('.detail-reason-toggle:checked');
            checked.forEach(input => {
                // Each checkbox has a data-reasons attribute with JSON array of reason strings
                const reasons = input.dataset.reasons;
                if (reasons) {
                    try {
                        JSON.parse(reasons).forEach(r => hidden.add(r));
                    } catch (e) {}
                } else {
                    hidden.add(input.value);
                }
            });
            return hidden;
        }

        function buildClassificationDetailCounts(variantsData) {
            // Returns Map<reason, {count, category}>
            const detailCounts = new Map();
            if (!variantsData || !Array.isArray(variantsData.text)) {
                return detailCounts;
            }

            const masechet = (variantsData.title || "").replace("Variants on ", "");
            variantsData.text.forEach((variantPerek, perekIndex) => {
                if (!Array.isArray(variantPerek)) return;
                variantPerek.forEach((variantHalakha, halachaIndex) => {
                    if (!Array.isArray(variantHalakha)) return;
                    variantHalakha.forEach((variantItem, itemIndex) => {
                        if (typeof variantItem !== "string" || !variantItem.includes("|")) return;
                        const loc = [masechet, perekIndex, halachaIndex, itemIndex];
                        const parsedNote = parseNote3(variantItem, loc);
                        if (!Array.isArray(parsedNote) || (parsedNote.length !== 2 && parsedNote.length !== 3)) return;

                        const sv = parsedNote[0];
                        const vars = parsedNote[1];
                        if (!Array.isArray(vars)) return;

                        vars.forEach(([, varText]) => {
                            const classification = classifyVariantPair(sv[0], varText);
                            const existing = detailCounts.get(classification.reason);
                            if (existing) {
                                existing.count++;
                            } else {
                                detailCounts.set(classification.reason, {
                                    count: 1,
                                    category: classification.category
                                });
                            }
                        });
                    });
                });
            });

            return detailCounts;
        }

        function renderClassificationDetailControls(variantsData) {
            // Clear all detail slots
            document.querySelectorAll('.detail-slot').forEach(slot => {
                slot.innerHTML = '';
            });

            const counts = buildClassificationDetailCounts(variantsData);
            const selected = getHiddenReasonDetailsSet();

            // Group raw reasons into Hebrew display groups per category
            // Structure: category → groupKey → { hebrew, totalCount, items[] }
            const byCategory = new Map();
            for (const [reason, { count, category }] of counts) {
                const group = groupReason(reason);
                if (!group) continue;

                if (!byCategory.has(category)) {
                    byCategory.set(category, new Map());
                }
                const catGroups = byCategory.get(category);
                if (!catGroups.has(group.key)) {
                    catGroups.set(group.key, { hebrew: group.hebrew, totalCount: 0, items: [] });
                }
                const g = catGroups.get(group.key);
                g.totalCount += count;
                g.items.push({ reason, count, hebrew: reasonToHebrew(reason) });
            }

            // Render grouped checkboxes into category slots
            let globalIdx = 0;
            for (const [category, groups] of byCategory) {
                const slot = document.querySelector(`.detail-slot[data-category="${category}"]`);
                if (!slot) continue;

                const sorted = [...groups.values()].sort((a, b) => b.totalCount - a.totalCount);

                sorted.forEach(({ hebrew, totalCount, items }) => {
                    const groupId = `dg_${globalIdx++}`;
                    const allReasons = items.map(i => i.reason);
                    const allChecked = allReasons.every(r => selected.has(r));
                    const someChecked = !allChecked && allReasons.some(r => selected.has(r));

                    if (items.length === 1) {
                        // Single reason — simple checkbox, no expand
                        const reasonsJson = escapeHtml(JSON.stringify(allReasons));
                        const checked = allChecked ? 'checked' : '';
                        slot.innerHTML += `<label><input class="detail-reason-toggle" type="checkbox" id="${groupId}" data-reasons="${reasonsJson}" ${checked}> ${escapeHtml(hebrew)} <span class="detail-count">(${totalCount})</span></label>`;
                    } else {
                        // Multi-reason group — expandable
                        const reasonsJson = escapeHtml(JSON.stringify(allReasons));
                        const checked = allChecked ? 'checked' : '';

                        let html = `<div class="detail-group">`;
                        html += `<div class="detail-group-header">`;
                        html += `<label><input class="detail-reason-group-toggle" type="checkbox" data-reasons="${reasonsJson}" data-group="${groupId}" ${checked}> ${escapeHtml(hebrew)} <span class="detail-count">(${totalCount})</span></label>`;
                        html += `<span class="detail-expand" data-target="${groupId}">◂</span>`;
                        html += `</div>`;
                        html += `<div class="detail-group-children" id="${groupId}">`;

                        items.sort((a, b) => b.count - a.count);
                        items.forEach((item, idx) => {
                            const childId = `${groupId}_${idx}`;
                            const childReasons = escapeHtml(JSON.stringify([item.reason]));
                            const childChecked = selected.has(item.reason) ? 'checked' : '';
                            html += `<label><input class="detail-reason-toggle" type="checkbox" id="${childId}" data-reasons="${childReasons}" data-parent-group="${groupId}" ${childChecked}> ${escapeHtml(item.hebrew)} <span class="detail-count">(${item.count})</span></label>`;
                        });

                        html += `</div></div>`;
                        slot.innerHTML += html;
                    }
                });
            }

            // Set indeterminate state on group checkboxes where some (not all) children are checked
            document.querySelectorAll('.detail-reason-group-toggle').forEach(groupCb => {
                const groupId = groupCb.dataset.group;
                const children = document.querySelectorAll(`[data-parent-group="${groupId}"]`);
                const checkedCount = [...children].filter(c => c.checked).length;
                if (checkedCount > 0 && checkedCount < children.length) {
                    groupCb.indeterminate = true;
                    groupCb.checked = false;
                }
            });

            // Expand/collapse handlers
            document.querySelectorAll('.detail-expand').forEach(btn => {
                btn.addEventListener('click', () => {
                    const target = document.getElementById(btn.dataset.target);
                    if (target) {
                        const isOpen = target.classList.toggle('open');
                        btn.textContent = isOpen ? '▾' : '◂';
                        btn.classList.toggle('open', isOpen);
                    }
                });
            });

            // Group checkbox → sync all children
            document.querySelectorAll('.detail-reason-group-toggle').forEach(groupCb => {
                groupCb.addEventListener('change', () => {
                    const groupId = groupCb.dataset.group;
                    document.querySelectorAll(`[data-parent-group="${groupId}"]`).forEach(child => {
                        child.checked = groupCb.checked;
                    });
                    groupCb.indeterminate = false;
                    if (typeof refreshCurrentDisplay === 'function') refreshCurrentDisplay();
                });
            });

            // Child checkbox → sync group parent state
            document.querySelectorAll('.detail-reason-toggle[data-parent-group]').forEach(childCb => {
                childCb.addEventListener('change', () => {
                    const groupId = childCb.dataset.parentGroup;
                    const siblings = document.querySelectorAll(`[data-parent-group="${groupId}"]`);
                    const groupToggle = document.querySelector(`.detail-reason-group-toggle[data-group="${groupId}"]`);
                    if (groupToggle) {
                        const allChecked = [...siblings].every(s => s.checked);
                        const someChecked = [...siblings].some(s => s.checked);
                        groupToggle.checked = allChecked;
                        groupToggle.indeterminate = someChecked && !allChecked;
                    }
                    if (typeof refreshCurrentDisplay === 'function') refreshCurrentDisplay();
                });
            });

            // Simple (non-grouped) detail toggles
            document.querySelectorAll('.detail-reason-toggle:not([data-parent-group])').forEach(input => {
                input.onchange = () => {
                    if (typeof refreshCurrentDisplay === 'function') refreshCurrentDisplay();
                };
            });
        }

        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        // Check if masechet is in the URL
        var masechet = getUrlParameter('masechet');
        // Populate the dropdown
        const dropdown = document.getElementById('masechet-dropdown');
        locations.forEach(location => {
            const option = document.createElement('option');
            option.value = location;
            option.textContent = location.split('/')[1].replace('Tosefta%20', '').replace('%20', ' ');
            dropdown.appendChild(option);
        });
        function findOptionValueByText(selectElement, text) {
            for(var i = 0; i < selectElement.options.length; i++) {
                if(selectElement.options[i].text === text) {
                    return selectElement.options[i].value;
                }
            }
            return null;
        }

        if (masechet) {
            const matchedValue = findOptionValueByText(document.getElementById('masechet-dropdown'), masechet);
            if (matchedValue) {
                document.getElementById('masechet-dropdown').value = matchedValue;
                loadSelectedMasechet();
            } else {
                console.warn('Unrecognized masechet in URL:', masechet);
            }
        }
        function updateUrl(masechet) {
            var newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?masechet=' + encodeURIComponent(masechet);
            window.history.pushState({path:newUrl},'',newUrl);
        }
        // Function to load the selected masechet
        // --- TOC navigation ---
        const tocNav = document.getElementById('toc-nav');
        let tocObserver = null;

        function buildTocNav(textData) {
            tocNav.innerHTML = '';
            if (tocObserver) {
                tocObserver.disconnect();
                tocObserver = null;
            }

            const textArray = textData.text;
            if (!textArray || textArray.length === 0) {
                tocHasContent = false;
                syncTocToggleVisibility();
                return;
            }
            tocHasContent = true;
            syncTocToggleVisibility();

            textArray.forEach((textPerek, perekIndex) => {
                const group = document.createElement('div');
                group.className = 'toc-perek';

                const label = document.createElement('a');
                label.className = 'toc-perek-label';
                label.textContent = convert_number(perekIndex + 1);
                label.href = `#perek-${perekIndex}`;
                label.addEventListener('click', (e) => {
                    e.preventDefault();
                    closeDrawers();
                    document.getElementById(`perek-${perekIndex}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                group.appendChild(label);

                const halakhot = document.createElement('div');
                halakhot.className = 'toc-halakhot';
                textPerek.forEach((_, halachaIndex) => {
                    const link = document.createElement('a');
                    link.className = 'toc-h';
                    link.textContent = halachaIndex + 1;
                    link.href = `#hal-${perekIndex}-${halachaIndex}`;
                    link.dataset.halId = `hal-${perekIndex}-${halachaIndex}`;
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        closeDrawers();
                        document.getElementById(`hal-${perekIndex}-${halachaIndex}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    halakhot.appendChild(link);
                });
                group.appendChild(halakhot);
                tocNav.appendChild(group);
            });

            // Highlight current halakha on scroll
            tocObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const link = tocNav.querySelector(`.toc-h[data-hal-id="${entry.target.id}"]`);
                    if (link) {
                        link.classList.toggle('active', entry.isIntersecting);
                    }
                });
            }, { rootMargin: '-60px 0px -70% 0px' });

            document.querySelectorAll('.paragraph-pair[id]').forEach(el => {
                tocObserver.observe(el);
            });
        }

        function loadSelectedMasechet() {
            const selectedLocation = dropdown.value.replace(' ', "%20");
            const selectedText = dropdown.options[dropdown.selectedIndex].text;
            updateUrl(selectedText);

            Promise.all([
                getToseftaText(selectedLocation),
                getToseftavariants(selectedLocation),
                getWitnessAlignment(selectedLocation),
                getEditionAlignment(selectedLocation),
                getParallelsData(selectedLocation),
                getApparatusData(selectedLocation),
                ...MANUSCRIPT_WITNESS_SLUGS.map(slug => getManuscriptImageData(selectedLocation, slug)),
                ...COMMENTARY_SLUGS.map(slug => getCommentaryData(selectedLocation, slug)),
                ...OCR_COMMENTARY_SLUGS.map(slug => getOcrCommentaryData(selectedLocation, slug))
            ])
            .then(([textData, variantsData, witnessData, editionsData, parallelsData,
                    apparatusData, ...rest]) => {
                const manuscriptDataList = rest.slice(0, MANUSCRIPT_WITNESS_SLUGS.length);
                const commentaryDataList = rest.slice(
                    MANUSCRIPT_WITNESS_SLUGS.length,
                    MANUSCRIPT_WITNESS_SLUGS.length + COMMENTARY_SLUGS.length);
                const ocrCommentaryDataList = rest.slice(
                    MANUSCRIPT_WITNESS_SLUGS.length + COMMENTARY_SLUGS.length);
                currentTextData = textData;
                currentVariantsData = variantsData;
                currentWitnessData = witnessData;
                currentEditionsData = editionsData;
                const manuscriptDataBySlug = {};
                MANUSCRIPT_WITNESS_SLUGS.forEach((slug, i) => { manuscriptDataBySlug[slug] = manuscriptDataList[i]; });
                currentManuscriptData = manuscriptDataBySlug;
                const commentaryBySlug = {};
                COMMENTARY_SLUGS.forEach((slug, i) => { commentaryBySlug[slug] = commentaryDataList[i]; });
                currentCommentaryData = commentaryBySlug;
                const ocrCommentaryBySlug = {};

// --- DOCX export (lazy-loads docx.js from CDN on first use) ---

let _docxLibPromise = null;
function loadDocxLib() {
    if (window.docx) return Promise.resolve(window.docx);
    if (_docxLibPromise) return _docxLibPromise;
    _docxLibPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/docx@9.0.2/build/index.umd.js';
        s.onload = () => window.docx ? resolve(window.docx) : reject(new Error('docx global missing'));
        s.onerror = () => reject(new Error('failed to load docx library'));
        document.head.appendChild(s);
    });
    return _docxLibPromise;
}

function getExportSettings() {
    return {
        hiddenCategories: getHiddenCategoriesSet(),
        hiddenReasonDetails: getHiddenReasonDetailsSet(),
        hideSoleWitnessSigla: getHideSoleWitnessSigla(),
        eclectic: document.getElementById('eclecticText').checked,
    };
}

// Build the footnote text for one apparatus note, honoring the active filters
// and the eclectic inversion. Returns null when the note has no visible content.
function buildFootnotePlain(note, settings, swap) {
    if (typeof note !== 'string') return null;
    if (!note.includes('|')) {
        if (note.startsWith('<b>כי"ע</b>')) return null; // Sotah Erfurt block — ignored
        const t = stripMarkup(note).trim();
        return t || null;
    }
    const parsed = parseNote3(note, null);
    if (typeof parsed === 'string') return stripMarkup(parsed).trim() || null;
    if (!Array.isArray(parsed) || parsed.length < 2) return null;
    let sv = parsed[0], vars = parsed[1];
    const affirming = parsed.length === 3 ? parsed[2] : null;
    if (!Array.isArray(vars)) return null;

    if (swap && swap.applied && !swap.isOmission) {
        const origLemma = sv[0];
        vars = vars.map(([w, t]) =>
            (w === swap.altWitnesses && stripMarkup(t).trim() === swap.altText) ? ['ב', origLemma] : [w, t]);
        sv = [swap.altText, sv[1]];
    }

    const multi = isMultiWitness(vars);
    const visible = [];
    vars.forEach(([wit, vt]) => {
        const d = shouldHideVariant(sv[0], vt, {
            hideSoleWitnessSigla: settings.hideSoleWitnessSigla,
            readingWitnesses: wit,
            hiddenCategories: settings.hiddenCategories,
            hiddenReasonDetails: settings.hiddenReasonDetails,
        }, multi);
        if (!d.hidden) visible.push(`${stripMarkup(wit)} ${stripMarkup(vt)}`.trim());
    });
    if (!visible.length) return null;

    let svLabel = stripMarkup(sv[0]).trim();
    if (sv[1]) svLabel += ' ' + stripMarkup(sv[1]).trim();
    if (affirming) svLabel += ' כ״ה ' + stripMarkup(affirming).trim() + '.';
    return `${svLabel} | ${visible.join('. ')}.`;
}

// Build the runs for one halakha paragraph (Vienna text + footnote refs +
// eclectic-swap coloring). ctx = { docx, settings, footnotes, fnId }.
function buildHalakhaRuns(bodyText, halakhaVars, hi, isKiy, ctx) {
    const { docx, settings } = ctx;
    const runs = [new docx.TextRun({ text: `${hi + 1}. `, bold: true, rightToLeft: true })];
    const offset = isKiy ? 1 : 0;

    const swapByNote = new Map();
    if (settings.eclectic) {
        halakhaVars.forEach((vi, idx) => {
            if (typeof vi !== 'string' || !vi.includes('|')) return;
            const parsed = parseNote3(vi, null);
            if (!Array.isArray(parsed)) return;
            const swap = findEclecticSwap(parsed[0], parsed[1], parsed.length === 3 ? parsed[2] : null);
            if (swap) swapByNote.set(idx, swap);
        });
    }

    // Strip tags WITHOUT trimming so inter-segment spaces survive (a trailing
    // space before a marker keeps the footnote / green word from gluing to the
    // preceding word).
    const stripKeepSpace = s => String(s || '')
        .replace(/<br\s*\/?>/gi, ' ')
        .replace(/<[^>]+>/g, '')
        .replace(/[\[\]]/g, '');

    const segs = bodyText.split(/<i data-commentator="Variants" data-label="[^"]*" data-order="\d+"><\/i>/);
    segs.forEach((seg, si) => {
        let segText = stripKeepSpace(seg);
        // Eclectic lemma: the swapped lemma is the first word of this segment
        // (the marker for note si-1 sits just before it).
        const lemmaNoteIdx = (si - 1) + offset;
        const swap = si > 0 ? swapByNote.get(lemmaNoteIdx) : null;
        if (swap && segText.trim()) {
            const m = segText.match(/^(\s*)(\S+)([\s\S]*)$/);
            const firstWord = m ? m[2].replace(/[.,;:!?׳״]+$/, '') : null;
            if (m && firstWord === swap.lemma) {
                swap.applied = true;
                if (m[1]) runs.push(new docx.TextRun({ text: m[1], rightToLeft: true }));
                if (swap.isOmission) {
                    runs.push(new docx.TextRun({ text: m[3].replace(/^\s*/, ''), rightToLeft: true }));
                } else {
                    runs.push(new docx.TextRun({ text: swap.altText, color: '2D7A3E', rightToLeft: true }));
                    runs.push(new docx.TextRun({ text: m[3], rightToLeft: true }));
                }
            } else if (segText) {
                runs.push(new docx.TextRun({ text: segText, rightToLeft: true }));
            }
        } else if (segText) {
            runs.push(new docx.TextRun({ text: segText, rightToLeft: true }));
        }

        // Footnote at the marker following this segment.
        if (si < segs.length - 1) {
            const note = halakhaVars[si + offset];
            const fnText = buildFootnotePlain(note, settings, swapByNote.get(si + offset));
            if (fnText) {
                const id = ++ctx.fnId;
                ctx.footnotes[id] = {
                    children: [new docx.Paragraph({
                        bidirectional: true,
                        children: [new docx.TextRun({ text: fnText, rightToLeft: true })],
                    })],
                };
                runs.push(new docx.FootnoteReferenceRun(id));
            }
        }
    });
    return runs;
}

async function exportToDocx() {
    if (!currentTextData || !currentVariantsData) { alert('יש לטעון מסכת תחילה.'); return; }
    const btn = document.getElementById('export-docx');
    btn.disabled = true; btn.classList.add('loading');
    try {
        const docx = await loadDocxLib();
        const settings = getExportSettings();
        const ctx = { docx, settings, footnotes: {}, fnId: 0 };
        const title = currentTextData.heTitle || (currentVariantsData.title || '').replace('Variants on ', '');

        const children = [new docx.Paragraph({
            heading: docx.HeadingLevel.HEADING_1,
            bidirectional: true,
            alignment: docx.AlignmentType.CENTER,
            children: [new docx.TextRun({ text: title, bold: true, rightToLeft: true })],
        })];

        currentTextData.text.forEach((perek, pi) => {
            const chapterVars = (currentVariantsData.text && currentVariantsData.text[pi]) || [];
            const isKiy = isKiyChapter(chapterVars);
            children.push(new docx.Paragraph({
                heading: docx.HeadingLevel.HEADING_2,
                bidirectional: true,
                alignment: docx.AlignmentType.CENTER,
                children: [new docx.TextRun({ text: 'פרק ' + convert_number(pi + 1), bold: true, rightToLeft: true })],
            }));
            perek.forEach((bodyText, hi) => {
                const halakhaVars = chapterVars[hi] || [];
                children.push(new docx.Paragraph({
                    bidirectional: true,
                    spacing: { after: 120 },
                    children: buildHalakhaRuns(bodyText, halakhaVars, hi, isKiy, ctx),
                }));
            });
        });

        const doc = new docx.Document({ footnotes: ctx.footnotes, sections: [{ properties: {}, children }] });
        const blob = await docx.Packer.toBlob(doc);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (title || 'tosefta').replace(/\s+/g, '_') + '.docx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    } catch (e) {
        console.error(e);
        alert('שגיאה בייצוא ל‑Word: ' + e.message);
    } finally {
        btn.disabled = false; btn.classList.remove('loading');
    }
}

document.getElementById('export-docx').addEventListener('click', exportToDocx);
